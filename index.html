<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DM-AI</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0d0d0f;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
        }

        /* =========================
           FANTASY BACKGROUND
        ========================= */

        .fantasy-background {
            position: fixed;
            inset: 0;
            overflow: hidden;
            pointer-events: none;
            z-index: 0;
        }

        .fantasy-emoji {
            position: absolute;
            font-size: 48px;
            opacity: 0.065;
            animation: float 12s infinite ease-in-out;
        }

        .emoji1 {
            top: 10%;
            left: 25%;
        }

        .emoji2 {
            top: 25%;
            right: 8%;
            animation-delay: 2s;
        }

        .emoji3 {
            bottom: 15%;
            left: 20%;
            animation-delay: 4s;
        }

        .emoji4 {
            bottom: 25%;
            right: 20%;
            animation-delay: 1s;
        }

        .emoji5 {
            top: 55%;
            left: 5%;
            animation-delay: 3s;
        }

        .emoji6 {
            top: 8%;
            right: 30%;
            animation-delay: 5s;
        }

        .emoji7 {
            bottom: 5%;
            right: 5%;
            animation-delay: 6s;
        }

        .emoji8 {
            top: 40%;
            right: 40%;
            animation-delay: 2s;
        }

        .emoji9 {
            top: 75%;
            left: 45%;
            animation-delay: 7s;
        }

        .emoji10 {
            top: 15%;
            left: 5%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) rotate(0deg);
            }

            50% {
                transform: translateY(-20px) rotate(5deg);
            }
        }

        /* =========================
           APP
        ========================= */

        .app {
            position: relative;
            z-index: 1;
            display: flex;
            height: 100vh;
        }

        /* =========================
           SIDEBAR
        ========================= */

        .sidebar {
            width: 270px;
            background: rgba(20, 20, 22, 0.97);
            border-right: 1px solid #29292d;
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 22px;
            border-bottom: 1px solid #29292d;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 18px;
        }

        .new-campaign {
            width: 100%;
            background: #ffffff;
            color: #111111;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .new-campaign:hover {
            background: #dddddd;
            transform: translateY(-1px);
        }

        .history-title {
            padding: 18px 20px 10px;
            font-size: 12px;
            color: #777777;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .chat-list {
            flex: 1;
            overflow-y: auto;
            padding: 5px 10px;
        }

        .chat-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px;
            border-radius: 9px;
            cursor: pointer;
            margin-bottom: 4px;
            transition: 0.2s;
        }

        .chat-item:hover {
            background: #222226;
        }

        .chat-item.active {
            background: #29292e;
        }

        .chat-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            padding-right: 8px;
            flex: 1;
        }

        .delete-chat {
            background: none;
            border: none;
            color: #777777;
            cursor: pointer;
            font-size: 14px;
            opacity: 0;
            transition: 0.2s;
        }

        .chat-item:hover .delete-chat {
            opacity: 1;
        }

        .delete-chat:hover {
            color: #ff5c5c;
        }

        /* =========================
           MAIN
        ========================= */

        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        .topbar {
            height: 65px;
            border-bottom: 1px solid #29292d;
            display: flex;
            align-items: center;
            padding: 0 25px;
            background: rgba(13, 13, 15, 0.88);
            flex-shrink: 0;
        }

        .mobile-menu {
            display: none;
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            margin-right: 15px;
        }

        .campaign-title {
            font-size: 16px;
            color: #dddddd;
            font-weight: 600;
        }

        /* =========================
           CHAT AREA
        ========================= */

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px 20px;
            scroll-behavior: smooth;
        }

        .welcome {
            max-width: 850px;
            margin: auto;
            text-align: center;
            padding-top: 7vh;
        }

        .welcome-icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .welcome h1 {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .welcome p {
            color: #8c8c91;
            font-size: 17px;
            margin-bottom: 35px;
        }

        /* =========================
           EXAMPLES
        ========================= */

        .examples {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 30px;
        }

        .example {
            background: rgba(23, 23, 25, 0.9);
            border: 1px solid #29292d;
            border-radius: 12px;
            padding: 16px;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
        }

        .example:hover {
            background: #202024;
            border-color: #444449;
            transform: translateY(-2px);
        }

        .example-title {
            font-weight: bold;
            margin-bottom: 6px;
        }

        .example-text {
            color: #85858a;
            font-size: 13px;
            line-height: 1.45;
        }

        /* =========================
           MESSAGES
        ========================= */

        .message {
            max-width: 850px;
            margin: 0 auto 28px;
        }

        .message-user {
            background: #222226;
            border-radius: 14px;
            padding: 15px 18px;
            margin-left: auto;
            max-width: 75%;
            line-height: 1.55;
            white-space: pre-wrap;
        }

        .message-ai {
            padding: 15px 5px;
            line-height: 1.7;
            color: #eeeeee;
            white-space: pre-wrap;
        }

        .message-label {
            font-size: 11px;
            color: #777777;
            margin-bottom: 7px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .loading {
            color: #999999;
            font-style: italic;
        }

        /* =========================
           INPUT
        ========================= */

        .input-section {
            padding: 20px;
            background: linear-gradient(
                transparent,
                #0d0d0f 25%
            );
            flex-shrink: 0;
        }

        .input-container {
            max-width: 850px;
            margin: auto;
            background: #1a1a1d;
            border: 1px solid #343438;
            border-radius: 16px;
            padding: 12px;
            box-shadow: 0 5px 30px rgba(0, 0, 0, 0.25);
        }

        textarea {
            width: 100%;
            min-height: 70px;
            max-height: 180px;
            resize: none;
            background: transparent;
            border: none;
            outline: none;
            color: white;
            font-size: 15px;
            padding: 5px;
            font-family: inherit;
        }

        textarea::placeholder {
            color: #6f6f74;
        }

        .input-bottom {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
        }

        .hint {
            color: #66666b;
            font-size: 12px;
        }

        .generate {
            border: none;
            background: white;
            color: #111111;
            border-radius: 10px;
            padding: 10px 17px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }

        .generate:hover {
            background: #dddddd;
        }

        .generate:active {
            transform: scale(0.97);
        }

        .generate:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            body {
                overflow: hidden;
            }

            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 10;
                transform: translateX(-100%);
                box-shadow: 10px 0 30px rgba(0, 0, 0, 0.4);
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .mobile-menu {
                display: block;
            }

            .welcome {
                padding-top: 3vh;
            }

            .welcome h1 {
                font-size: 32px;
            }

            .welcome p {
                font-size: 15px;
            }

            .examples {
                grid-template-columns: 1fr;
            }

            .message-user {
                max-width: 90%;
            }

            .hint {
                display: none;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         FANTASY BACKGROUND
    ========================= -->

    <div class="fantasy-background">

        <div class="fantasy-emoji emoji1">⚔️</div>
        <div class="fantasy-emoji emoji2">🛡️</div>
        <div class="fantasy-emoji emoji3">🧙</div>
        <div class="fantasy-emoji emoji4">🏰</div>
        <div class="fantasy-emoji emoji5">🗡️</div>
        <div class="fantasy-emoji emoji6">🐉</div>
        <div class="fantasy-emoji emoji7">⚔️</div>
        <div class="fantasy-emoji emoji8">🛡️</div>
        <div class="fantasy-emoji emoji9">🐲</div>
        <div class="fantasy-emoji emoji10">🧝</div>

    </div>


    <!-- =========================
         APP
    ========================= -->

    <div class="app">

        <!-- =========================
             SIDEBAR
        ========================= -->

        <aside class="sidebar" id="sidebar">

            <div class="sidebar-header">

                <div class="logo">
                    ⚔️ DM-AI
                </div>

                <button
                    class="new-campaign"
                    onclick="newCampaign()">

                    + New Campaign

                </button>

            </div>

            <div class="history-title">
                Campaigns
            </div>

            <div
                class="chat-list"
                id="chatList">
            </div>

        </aside>


        <!-- =========================
             MAIN
        ========================= -->

        <main class="main">

            <div class="topbar">

                <button
                    class="mobile-menu"
                    onclick="toggleSidebar()">

                    ☰

                </button>

                <div
                    class="campaign-title"
                    id="campaignTitle">

                    New Campaign

                </div>

            </div>


            <!-- =========================
                 CHAT
            ========================= -->

            <div
                class="chat-area"
                id="chatArea">
            </div>


            <!-- =========================
                 INPUT
            ========================= -->

            <div class="input-section">

                <div class="input-container">

                    <textarea
                        id="prompt"
                        placeholder="Describe the campaign you want..."
                        onkeydown="handleKey(event)">
                    </textarea>

                    <div class="input-bottom">

                        <div class="hint">
                            Press Enter to generate
                        </div>

                        <button
                            class="generate"
                            id="generateButton"
                            onclick="generateCampaign()">

                            Generate ⚔️

                        </button>

                    </div>

                </div>

            </div>

        </main>

    </div>


<script>

    /* =====================================================
       CAMPAIGNS
    ===================================================== */

    let campaigns = [];

    let currentCampaign = null;

    let isGenerating = false;


    /* =====================================================
       LOAD SAVED CAMPAIGNS
    ===================================================== */

    function loadCampaigns() {

        try {

            const saved =
                localStorage.getItem("dm_ai_campaigns");

            if (saved) {

                campaigns = JSON.parse(saved);

            }

        } catch (error) {

            console.error(
                "Could not load campaigns:",
                error
            );

            campaigns = [];

        }

    }


    /* =====================================================
       SAVE CAMPAIGNS
    ===================================================== */

    function saveCampaigns() {

        try {

            localStorage.setItem(
                "dm_ai_campaigns",
                JSON.stringify(campaigns)
            );

        } catch (error) {

            console.error(
                "Could not save campaigns:",
                error
            );

        }

    }


    /* =====================================================
       NEW CAMPAIGN
    ===================================================== */

    function newCampaign() {

        const campaign = {

            id: Date.now(),

            name: "New Campaign",

            messages: []

        };

        campaigns.unshift(campaign);

        currentCampaign = campaign;

        saveCampaigns();

        updateSidebar();

        renderCampaign();

        document
            .getElementById("prompt")
            .focus();

        closeMobileSidebar();

    }


    /* =====================================================
       UPDATE SIDEBAR
    ===================================================== */

    function updateSidebar() {

        const list =
            document.getElementById("chatList");

        list.innerHTML = "";


        campaigns.forEach(campaign => {

            const item =
                document.createElement("div");

            item.className =
                "chat-item " +
                (
                    currentCampaign &&
                    currentCampaign.id === campaign.id
                        ? "active"
                        : ""
                );


            const name =
                document.createElement("div");

            name.className =
                "chat-name";

            name.textContent =
                "⚔️ " + campaign.name;


            name.onclick = function () {

                selectCampaign(campaign.id);

            };


            const deleteButton =
                document.createElement("button");

            deleteButton.className =
                "delete-chat";

            deleteButton.textContent =
                "✕";


            deleteButton.onclick =
                function(event) {

                    deleteCampaign(
                        event,
                        campaign.id
                    );

                };


            item.appendChild(name);

            item.appendChild(deleteButton);

            list.appendChild(item);

        });

    }


    /* =====================================================
       SELECT CAMPAIGN
    ===================================================== */

    function selectCampaign(id) {

        currentCampaign =
            campaigns.find(
                campaign =>
                    campaign.id === id
            );


        if (!currentCampaign) {
            return;
        }


        renderCampaign();

        updateSidebar();

        closeMobileSidebar();

    }


    /* =====================================================
       DELETE CAMPAIGN
    ===================================================== */

    function deleteCampaign(event, id) {

        event.stopPropagation();


        const confirmed =
            confirm(
                "Delete this campaign?"
            );


        if (!confirmed) {
            return;
        }


        campaigns =
            campaigns.filter(
                campaign =>
                    campaign.id !== id
            );


        if (
            currentCampaign &&
            currentCampaign.id === id
        ) {

            currentCampaign =
                campaigns.length > 0
                    ? campaigns[0]
                    : null;

        }


        saveCampaigns();


        if (!currentCampaign) {

            newCampaign();

        } else {

            updateSidebar();

            renderCampaign();

        }

    }


    /* =====================================================
       RENDER CAMPAIGN
    ===================================================== */

    function renderCampaign() {

        const area =
            document.getElementById("chatArea");

        const title =
            document.getElementById("campaignTitle");


        if (!currentCampaign) {

            area.innerHTML = "";

            title.textContent =
                "New Campaign";

            return;

        }


        title.textContent =
            currentCampaign.name;


        /* Empty campaign */

        if (
            currentCampaign.messages.length === 0
        ) {

            area.innerHTML = `

                <div class="welcome">

                    <div class="welcome-icon">
                        🧙‍♂️
                    </div>

                    <h1>
                        What do you want to create?
                    </h1>

                    <p>
                        Tell DM-AI about your campaign idea and we'll build it with you.
                    </p>

                    <div class="examples">

                        <div
                            class="example"
                            onclick="useExample(this)">

                            <div class="example-title">
                                🐉 Epic Fantasy
                            </div>

                            <div class="example-text">
                                Create an epic fantasy campaign involving an ancient dragon returning after 1,000 years.
                            </div>

                        </div>


                        <div
                            class="example"
                            onclick="useExample(this)">

                            <div class="example-title">
                                🩸 Dark Horror
                            </div>

                            <div class="example-text">
                                Create a dark horror campaign where an entire village mysteriously disappears.
                            </div>

                        </div>


                        <div
                            class="example"
                            onclick="useExample(this)">

                            <div class="example-title">
                                🏰 Political Intrigue
                            </div>

                            <div class="example-text">
                                Create a campaign centered around rival kingdoms preparing for war.
                            </div>

                        </div>


                        <div
                            class="example"
                            onclick="useExample(this)">

                            <div class="example-title">
                                🗡️ Dungeon Adventure
                            </div>

                            <div class="example-text">
                                Create a dangerous dungeon filled with traps, monsters, treasure and a powerful boss.
                            </div>

                        </div>

                    </div>

                </div>

            `;

            return;

        }


        /* Messages */

        area.innerHTML = "";


        currentCampaign.messages.forEach(
            message => {

                const wrapper =
                    document.createElement("div");

                wrapper.className =
                    "message";


                if (message.role === "user") {

                    wrapper.innerHTML = `

                        <div class="message-label">
                            YOU
                        </div>

                        <div class="message-user"></div>

                    `;

                    wrapper
                        .querySelector(".message-user")
                        .textContent =
                            message.content;

                } else {

                    wrapper.innerHTML = `

                        <div class="message-label">
                            DM-AI
                        </div>

                        <div class="message-ai"></div>

                    `;

                    wrapper
                        .querySelector(".message-ai")
                        .textContent =
                            message.content;

                }


                area.appendChild(wrapper);

            }
        );


        area.scrollTop =
            area.scrollHeight;

    }


    /* =====================================================
       GENERATE CAMPAIGN WITH AI
    ===================================================== */

    async function generateCampaign() {

        if (isGenerating) {
            return;
        }


        const input =
            document.getElementById("prompt");

        const button =
            document.getElementById(
                "generateButton"
            );


        const prompt =
            input.value.trim();


        if (!prompt) {

            input.focus();

            return;

        }


        /* Create campaign if necessary */

        if (!currentCampaign) {

            newCampaign();

        }


        /* Add user message */

        currentCampaign.messages.push({

            role: "user",

            content: prompt

        });


        /* Give campaign a temporary name */

        if (
            currentCampaign.name ===
            "New Campaign"
        ) {

            currentCampaign.name =
                createCampaignName(prompt);

        }


        /* Clear input */

        input.value = "";


        /* Save */

        saveCampaigns();


        /* Render user message */

        updateSidebar();

        renderCampaign();


        /* Loading state */

        isGenerating = true;

        button.disabled = true;

        button.textContent =
            "Creating... ⚔️";


        currentCampaign.messages.push({

            role: "ai",

            content:
                "🧙 DM-AI is building your campaign..."

        });


        renderCampaign();


        try {

            const response =
                await fetch(
                    "/api/generate",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body: JSON.stringify({
                            prompt: prompt
                        })
                    }
                );


            const data =
                await response.json();


            /* Remove loading message */

            currentCampaign.messages.pop();


            /* Handle error */

            if (!response.ok) {

                throw new Error(
                    data.error ||
                    "The AI request failed."
                );

            }


            /* Add AI response */

            currentCampaign.messages.push({

                role: "ai",

                content:
                    data.result ||
                    "I wasn't able to generate a response."

            });


            saveCampaigns();

            renderCampaign();

            updateSidebar();


        } catch (error) {

            console.error(
                "DM-AI error:",
                error
            );


            /* Remove loading */

            currentCampaign.messages.pop();


            currentCampaign.messages.push({

                role: "ai",

                content:
                    "⚠️ Something went wrong.\n\n" +
                    error.message

            });


            saveCampaigns();

            renderCampaign();

        }


        /* Restore button */

        isGenerating = false;

        button.disabled = false;

        button.textContent =
            "Generate ⚔️";

    }


    /* =====================================================
       CREATE CAMPAIGN NAME
    ===================================================== */

    function createCampaignName(prompt) {

        let name =
            prompt
                .replace(/\s+/g, " ")
                .trim();


        if (name.length > 30) {

            name =
                name.substring(0, 30) +
                "...";

        }


        return name;

    }


    /* =====================================================
       EXAMPLE PROMPTS
    ===================================================== */

    function useExample(element) {

        const text =
            element.querySelector(
                ".example-text"
            ).textContent;


        const input =
            document.getElementById(
                "prompt"
            );


        input.value = text;

        input.focus();

    }


    /* =====================================================
       ENTER KEY
    ===================================================== */

    function handleKey(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            generateCampaign();

        }

    }


    /* =====================================================
       MOBILE SIDEBAR
    ===================================================== */

    function toggleSidebar() {

        document
            .getElementById("sidebar")
            .classList.toggle("open");

    }


    function closeMobileSidebar() {

        document
            .getElementById("sidebar")
            .classList.remove("open");

    }


    /* =====================================================
       AUTO RESIZE TEXTAREA
    ===================================================== */

    const promptBox =
        document.getElementById("prompt");


    promptBox.addEventListener(
        "input",
        function() {

            this.style.height =
                "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    180
                ) + "px";

        }
    );


    /* =====================================================
       START APP
    ===================================================== */

    loadCampaigns();


    if (campaigns.length > 0) {

        currentCampaign =
            campaigns[0];

    } else {

        newCampaign();

    }


    updateSidebar();

    renderCampaign();

</script>

</body>
</html>
