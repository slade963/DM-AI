<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>DM-AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #f5f0e6;

      background:
        radial-gradient(circle at top, rgba(80, 60, 110, 0.35), transparent 45%),
        linear-gradient(135deg, #09070d, #15101d 50%, #09070d);

      overflow-x: hidden;
    }

    /* =========================
       FLOATING EMOJIS
    ========================= */

    .emoji {
      position: fixed;
      opacity: 0.10;
      pointer-events: none;
      z-index: 0;
      user-select: none;
      filter: grayscale(30%);
    }

    .e1 { top: 8%; left: 4%; font-size: 80px; transform: rotate(-18deg); }
    .e2 { top: 22%; right: 5%; font-size: 90px; transform: rotate(20deg); }
    .e3 { top: 48%; left: 2%; font-size: 75px; transform: rotate(12deg); }
    .e4 { top: 65%; right: 3%; font-size: 85px; transform: rotate(-15deg); }
    .e5 { bottom: 5%; left: 8%; font-size: 70px; transform: rotate(15deg); }
    .e6 { bottom: 12%; right: 10%; font-size: 75px; transform: rotate(-20deg); }

    /* =========================
       MAIN APP
    ========================= */

    .app {
      position: relative;
      z-index: 1;
      width: min(1100px, 94%);
      margin: auto;
      padding: 45px 0 80px;
    }

    header {
      text-align: center;
      margin-bottom: 35px;
    }

    .logo {
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 2px;

      background: linear-gradient(
        90deg,
        #ffffff,
        #c9a7ff,
        #ffffff
      );

      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;

      text-shadow: 0 0 35px rgba(180, 130, 255, 0.25);
    }

    .subtitle {
      color: #aaa2b5;
      font-size: 17px;
      margin-top: 8px;
    }

    /* =========================
       BUILDER
    ========================= */

    .builder {
      background: rgba(18, 14, 25, 0.88);
      border: 1px solid rgba(190, 160, 255, 0.20);
      border-radius: 22px;
      padding: 28px;

      box-shadow:
        0 20px 70px rgba(0, 0, 0, 0.45),
        inset 0 0 40px rgba(150, 100, 255, 0.03);

      backdrop-filter: blur(12px);
    }

    .builder h2 {
      margin-top: 0;
      margin-bottom: 8px;
      font-size: 25px;
    }

    .builder p {
      color: #aaa2b5;
      margin-top: 0;
    }

    textarea {
      width: 100%;
      min-height: 140px;
      resize: vertical;

      background: #0b0910;
      border: 1px solid #342b42;
      border-radius: 15px;

      color: white;
      padding: 18px;

      font-size: 16px;
      line-height: 1.5;

      outline: none;
      transition: 0.2s;
    }

    textarea:focus {
      border-color: #9b6cff;
      box-shadow: 0 0 0 3px rgba(155, 108, 255, 0.10);
    }

    .generate {
      width: 100%;
      margin-top: 15px;
      padding: 16px;

      border: 0;
      border-radius: 14px;

      background: linear-gradient(
        135deg,
        #7547d9,
        #a56cff
      );

      color: white;
      font-size: 17px;
      font-weight: bold;

      cursor: pointer;
      transition: 0.2s;
    }

    .generate:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(140, 90, 255, 0.30);
    }

    .generate:disabled {
      opacity: 0.65;
      cursor: wait;
      transform: none;
    }

    /* =========================
       STATUS
    ========================= */

    #status {
      display: none;
      text-align: center;
      margin: 25px 0;
      color: #c7b5e8;
    }

    .loader {
      display: inline-block;
      width: 18px;
      height: 18px;

      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #a56cff;

      border-radius: 50%;

      animation: spin 0.8s linear infinite;

      vertical-align: middle;
      margin-right: 8px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* =========================
       ERROR
    ========================= */

    #error {
      display: none;

      background: rgba(100, 20, 30, 0.25);
      border: 1px solid rgba(255, 80, 100, 0.35);

      color: #ffb4bd;

      padding: 15px;
      border-radius: 12px;

      margin-top: 20px;
    }

    /* =========================
       RESULTS
    ========================= */

    #results {
      display: none;
      margin-top: 35px;
    }

    .campaign-header {
      background:
        linear-gradient(
          135deg,
          rgba(105, 65, 170, 0.30),
          rgba(30, 20, 45, 0.90)
        );

      border: 1px solid rgba(180, 140, 255, 0.25);
      border-radius: 22px;

      padding: 32px;
      margin-bottom: 20px;
    }

    .campaign-title {
      font-size: 38px;
      margin: 0 0 10px;
    }

    .campaign-description {
      color: #c5becd;
      line-height: 1.7;
      white-space: pre-wrap;
    }

    .tags {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 20px;
    }

    .tag {
      padding: 7px 12px;
      border-radius: 50px;

      background: rgba(165, 108, 255, 0.12);
      border: 1px solid rgba(165, 108, 255, 0.25);

      color: #d8c7ff;
      font-size: 13px;
    }

    /* =========================
       SECTIONS
    ========================= */

    .section {
      margin-top: 20px;

      background: rgba(18, 14, 25, 0.90);

      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 20px;
      padding: 25px;
    }

    .section-title {
      font-size: 25px;
      margin: 0 0 18px;

      display: flex;
      align-items: center;
      gap: 10px;
    }

    .story {
      color: #d1cad7;
      line-height: 1.8;
      white-space: pre-wrap;
    }

    /* =========================
       CARDS
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 15px;
    }

    .card {
      background: rgba(8, 7, 12, 0.75);
      border: 1px solid rgba(255,255,255,0.08);

      border-radius: 15px;
      padding: 18px;

      transition: 0.2s;
    }

    .card:hover {
      border-color: rgba(165, 108, 255, 0.30);
      transform: translateY(-2px);
    }

    .card h3 {
      margin-top: 0;
      margin-bottom: 10px;
      color: #e7dbff;
    }

    .card p {
      color: #b8b0bd;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .label {
      color: #9270d4;
      font-weight: bold;
      font-size: 13px;
      text-transform: uppercase;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    ul {
      padding-left: 20px;
      color: #c2bbc7;
      line-height: 1.7;
    }

    /* =========================
       STAT BLOCK
    ========================= */

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
      margin-top: 12px;
    }

    .stat {
      background: #100d15;
      border-radius: 8px;
      padding: 9px;
      text-align: center;
    }

    .stat strong {
      display: block;
      color: #e5d9f5;
      font-size: 17px;
    }

    .stat span {
      font-size: 10px;
      color: #817888;
      text-transform: uppercase;
    }

    /* =========================
       BOSS
    ========================= */

    .boss {
      border: 1px solid rgba(255, 80, 80, 0.25);

      background:
        linear-gradient(
          135deg,
          rgba(80, 15, 20, 0.35),
          rgba(15, 10, 15, 0.90)
        );
    }

    .boss h3 {
      color: #ffb0b0;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {
      .app {
        padding-top: 25px;
      }

      .logo {
        font-size: 38px;
      }

      .campaign-title {
        font-size: 28px;
      }

      .builder,
      .section,
      .campaign-header {
        padding: 20px;
      }

      .stats {
        grid-template-columns: repeat(2, 1fr);
      }
    }
  </style>
</head>

<body>

  <!-- FANTASY BACKGROUND -->

  <div class="emoji e1">⚔️</div>
  <div class="emoji e2">🛡️</div>
  <div class="emoji e3">♞</div>
  <div class="emoji e4">⚔️</div>
  <div class="emoji e5">🛡️</div>
  <div class="emoji e6">♟️</div>

  <main class="app">

    <header>
      <div class="logo">⚔️ DM-AI 🛡️</div>

      <div class="subtitle">
        Your AI-powered Dungeon Master
      </div>
    </header>

    <!-- BUILDER -->

    <section class="builder">

      <h2>What do you want to build?</h2>

      <p>
        Describe your campaign, adventure, world, or anything else
        you want DM-AI to create.
      </p>

      <textarea
        id="prompt"
        placeholder="Example: Create a dark fantasy campaign where an ancient dragon awakens beneath a ruined kingdom..."
      ></textarea>

      <button
        id="generateButton"
        class="generate"
        onclick="generateCampaign()"
      >
        ⚔️ Generate Campaign
      </button>

      <div id="status">
        <span class="loader"></span>
        DM-AI is building your campaign...
      </div>

      <div id="error"></div>

    </section>

    <!-- RESULTS -->

    <div id="results"></div>

  </main>

<script>

async function generateCampaign() {

  const promptBox = document.getElementById("prompt");
  const button = document.getElementById("generateButton");
  const status = document.getElementById("status");
  const errorBox = document.getElementById("error");
  const results = document.getElementById("results");

  const prompt = promptBox.value.trim();

  if (!prompt) {
    errorBox.style.display = "block";
    errorBox.textContent = "Tell DM-AI what you want to build first.";
    return;
  }

  button.disabled = true;
  button.textContent = "⚔️ Building...";
  status.style.display = "block";
  errorBox.style.display = "none";
  results.style.display = "none";

  try {

    const response = await fetch("/api/generate", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        prompt: prompt
      })

    });

    const data = await response.json();

    console.log("DM-AI RESPONSE:", data);

    if (!response.ok) {

      throw new Error(
        data.error ||
        data.details ||
        "DM-AI could not generate your campaign."
      );

    }

    /*
      Our API normally returns:

      {
        success: true,
        campaign: {...}
      }

      But this also handles the simpler response
      format we used during testing.
    */

    let campaign = data.campaign;

    if (!campaign && data.result) {

      try {
        campaign = JSON.parse(data.result);
      } catch {

        campaign = {
          title: "DM-AI Creation",
          description: data.result
        };

      }

    }

    if (!campaign) {
      throw new Error("No campaign data was returned.");
    }

    renderCampaign(campaign);

  } catch (error) {

    console.error(error);

    errorBox.style.display = "block";

    errorBox.textContent =
      "❌ " + error.message;

  } finally {

    button.disabled = false;
    button.textContent = "⚔️ Generate Campaign";
    status.style.display = "none";

  }

}


/* =========================================================
   RENDER CAMPAIGN
========================================================= */

function renderCampaign(campaign) {

  const results = document.getElementById("results");

  results.innerHTML = "";

  results.style.display = "block";


  /* =========================
     HEADER
  ========================= */

  const header = document.createElement("div");

  header.className = "campaign-header";

  header.innerHTML = `

    <h1 class="campaign-title">
      ${escapeHTML(campaign.title || "Untitled Campaign")}
    </h1>

    <div class="campaign-description">
      ${escapeHTML(
        campaign.description ||
        campaign.summary ||
        ""
      )}
    </div>

    <div class="tags">

      ${
        campaign.setting
        ? `<span class="tag">🌎 ${escapeHTML(campaign.setting)}</span>`
        : ""
      }

      ${
        campaign.tone
        ? `<span class="tag">🎭 ${escapeHTML(campaign.tone)}</span>`
        : ""
      }

      ${
        campaign.recommendedLevel
        ? `<span class="tag">⚔️ Level ${escapeHTML(campaign.recommendedLevel)}</span>`
        : ""
      }

    </div>

  `;

  results.appendChild(header);


  /* =========================
     MAIN STORY
  ========================= */

  if (campaign.mainStory || campaign.story) {

    let story = campaign.mainStory || campaign.story;

    if (typeof story === "object") {

      story = Object.entries(story)
        .map(([key, value]) => {

          return `${formatTitle(key)}

${typeof value === "string"
            ? value
            : JSON.stringify(value, null, 2)}`;

        })
        .join("\n\n");

    }

    addTextSection(
      results,
      "📖",
      "Main Story",
      story
    );

  }


  /* =========================
     LOCATIONS
  ========================= */

  renderCards(
    results,
    "🗺️",
    "Locations",
    campaign.locations,
    item => {

      return `

        <h3>${escapeHTML(item.name || "Unknown Location")}</h3>

        <div class="label">Description</div>

        <p>${escapeHTML(item.description || "")}</p>

        ${renderList(
          "Secrets",
          item.secrets
        )}

      `;

    }
  );


  /* =========================
     NPCS
  ========================= */

  renderCards(
    results,
    "🧑",
    "NPCs",
    campaign.npcs,
    item => {

      return `

        <h3>${escapeHTML(item.name || "Unknown NPC")}</h3>

        <div class="label">Role</div>
        <p>${escapeHTML(item.role || "")}</p>

        <div class="label">Race</div>
        <p>${escapeHTML(item.race || "")}</p>

        <div class="label">Personality</div>
        <p>${escapeHTML(item.personality || "")}</p>

        <div class="label">Motivation</div>
        <p>${escapeHTML(item.motivation || "")}</p>

        <div class="label">Secret</div>
        <p>${escapeHTML(item.secret || "")}</p>

        <div class="label">Dialogue</div>
        <p>“${escapeHTML(item.dialogue || "")}”</p>

        ${renderStats(item.stats)}

      `;

    }
  );


  /* =========================
     MONSTERS
  ========================= */

  renderCards(
    results,
    "👹",
    "Monsters",
    campaign.monsters,
    item => {

      return `

        <h3>${escapeHTML(item.name || "Unknown Monster")}</h3>

        <p>
          ${escapeHTML(item.description || "")}
        </p>

        <div class="label">Difficulty</div>

        <p>
          ${escapeHTML(item.difficulty || "")}
        </p>

        ${renderStats(item)}

        ${renderList(
          "Attacks",
          item.attacks
        )}

        ${renderList(
          "Abilities",
          item.abilities
        )}

        <div class="label">Tactics</div>

        <p>
          ${escapeHTML(item.tactics || "")}
        </p>

      `;

    }
  );


  /* =========================
     QUESTS
  ========================= */

  renderCards(
    results,
    "🎯",
    "Quests",
    campaign.quests,
    item => {

      return `

        <h3>${escapeHTML(item.name || "Unknown Quest")}</h3>

        <div class="label">Type</div>

        <p>${escapeHTML(item.type || "")}</p>

        <div class="label">Description</div>

        <p>${escapeHTML(item.description || "")}</p>

        <div class="label">Objective</div>

        <p>${escapeHTML(item.objective || "")}</p>

        <div class="label">Reward</div>

        <p>${escapeHTML(item.reward || "")}</p>

        <div class="label">Consequences</div>

        <p>${escapeHTML(item.consequences || "")}</p>

      `;

    }
  );


  /* =========================
     ENCOUNTERS
  ========================= */

  renderCards(
    results,
    "⚔️",
    "Encounters",
    campaign.encounters,
    item => {

      return `

        <h3>${escapeHTML(item.name || "Unknown Encounter")}</h3>

        <div class="label">Location</div>

        <p>${escapeHTML(item.location || "")}</p>

        <div class="label">Difficulty</div>

        <p>${escapeHTML(item.difficulty || "")}</p>

        <div class="label">Description</div>

        <p>${escapeHTML(item.description || "")}</p>

        ${renderList(
          "Enemies",
          item.enemies
        )}

        ${renderList(
          "Objectives",
          item.objectives
        )}

        <div class="label">DM Notes</div>

        <p>${escapeHTML(item.dmNotes || "")}</p>

      `;

    }
  );


  /* =========================
     ITEMS
  ========================= */

  renderCards(
    results,
    "🎒",
    "Items & Treasure",
    campaign.items,
    item => {

      return `

        <h3>${escapeHTML(item.name || "Unknown Item")}</h3>

        <div class="label">Type</div>

        <p>${escapeHTML(item.type || "")}</p>

        <div class="label">Rarity</div>

        <p>${escapeHTML(item.rarity || "")}</p>

        <div class="label">Description</div>

        <p>${escapeHTML(item.description || "")}</p>

        <div class="label">Effect</div>

        <p>${escapeHTML(item.effect || "")}</p>

      `;

    }
  );


  /* =========================
     PLAYER CHARACTERS
  ========================= */

  renderCards(
    results,
    "🧙",
    "Character Sheets",
    campaign.playerCharacters ||
    campaign.characters,
    item => {

      const scores =
        item.abilityScores ||
        item.ability_scores;

      return `

        <h3>${escapeHTML(item.name || "Unnamed Character")}</h3>

        <div class="label">Class</div>

        <p>${escapeHTML(item.class || "")}</p>

        <div class="label">Race</div>

        <p>${escapeHTML(item.race || "")}</p>

        <div class="label">Background</div>

        <p>${escapeHTML(item.background || "")}</p>

        <div class="label">Personality</div>

        <p>${escapeHTML(item.personality || "")}</p>

        <div class="label">Motivation</div>

        <p>${escapeHTML(item.motivation || "")}</p>

        <div class="label">Backstory</div>

        <p>${escapeHTML(item.backstory || "")}</p>

        ${renderAbilityScores(scores)}

        ${renderList(
          "Equipment",
          item.equipment
        )}

      `;

    }
  );


  /* =========================
     CHAPTERS
  ========================= */

  renderCards(
    results,
    "📚",
    "Campaign Chapters",
    campaign.chapters,
    item => {

      return `

        <h3>
          Chapter ${escapeHTML(
            String(item.number || item.chapterNumber || "")
          )}

          ${
            item.title
            ? " — " + escapeHTML(item.title)
            : ""
          }

        </h3>

        <div class="label">Summary</div>

        <p>${escapeHTML(item.summary || "")}</p>

        ${renderList(
          "Objectives",
          item.objectives
        )}

        ${renderList(
          "Events",
          item.events
        )}

        ${renderList(
          "Encounters",
          item.encounters
        )}

        <div class="label">DM Notes</div>

        <p>${escapeHTML(item.dmNotes || "")}</p>

      `;

    }
  );


  /* =========================
     FINAL BOSS
  ========================= */

  if (campaign.finalBoss || campaign.boss) {

    const boss =
      campaign.finalBoss ||
      campaign.boss;

    const section =
      document.createElement("section");

    section.className = "section boss";

    section.innerHTML = `

      <h2 class="section-title">
        👑 Final Boss
      </h2>

      <div class="card">

        <h3>
          ${escapeHTML(
            boss.name || "Final Boss"
          )}
        </h3>

        <p>
          ${escapeHTML(
            boss.description || ""
          )}
        </p>

        <div class="label">Difficulty</div>

        <p>
          ${escapeHTML(
            boss.difficulty || ""
          )}
        </p>

        ${renderStats(boss)}

        ${renderList(
          "Attacks",
          boss.attacks
        )}

        ${renderList(
          "Abilities",
          boss.abilities
        )}

        ${renderList(
          "Phases",
          boss.phases
        )}

        <div class="label">
          Tactics
        </div>

        <p>
          ${escapeHTML(
            boss.tactics || ""
          )}
        </p>

      </div>

    `;

    results.appendChild(section);

  }


  /* =========================
     DM NOTES
  ========================= */

  renderCards(
    results,
    "🎲",
    "DM Notes",
    campaign.dmNotes,
    item => {

      if (typeof item === "string") {

        return `
          <p>${escapeHTML(item)}</p>
        `;

      }

      return `
        <h3>
          ${escapeHTML(
            item.title || "DM Tip"
          )}
        </h3>

        <p>
          ${escapeHTML(
            item.description || ""
          )}
        </p>
      `;

    }
  );


  /* Scroll to result */

  results.scrollIntoView({
    behavior: "smooth",
    block: "start"
  });

}


/* =========================================================
   SECTION HELPERS
========================================================= */

function addTextSection(
  parent,
  icon,
  title,
  text
) {

  const section =
    document.createElement("section");

  section.className = "section";

  section.innerHTML = `

    <h2 class="section-title">
      ${icon} ${title}
    </h2>

    <div class="story">
      ${escapeHTML(text || "")}
    </div>

  `;

  parent.appendChild(section);
}


function renderCards(
  parent,
  icon,
  title,
  items,
  renderer
) {

  if (!items || !Array.isArray(items) || items.length === 0) {
    return;
  }

  const section =
    document.createElement("section");

  section.className = "section";

  const grid =
    document.createElement("div");

  grid.className = "grid";

  items.forEach(item => {

    const card =
      document.createElement("div");

    card.className = "card";

    card.innerHTML =
      renderer(item);

    grid.appendChild(card);

  });

  section.innerHTML = `
    <h2 class="section-title">
      ${icon} ${title}
    </h2>
  `;

  section.appendChild(grid);

  parent.appendChild(section);
}


function renderList(
  title,
  items
) {

  if (!items) {
    return "";
  }

  if (!Array.isArray(items) || items.length === 0) {
    return "";
  }

  return `

    <div class="label">
      ${escapeHTML(title)}
    </div>

    <ul>

      ${items.map(item => {

        const value =
          typeof item === "string"
            ? item
            : JSON.stringify(item);

        return `
          <li>
            ${escapeHTML(value)}
          </li>
        `;

      }).join("")}

    </ul>

  `;

}


function renderAbilityScores(
  scores
) {

  if (!scores) {
    return "";
  }

  return `

    <div class="label">
      Ability Scores
    </div>

    <div class="stats">

      ${statBox("STR", scores.strength)}

      ${statBox("DEX", scores.dexterity)}

      ${statBox("CON", scores.constitution)}

      ${statBox("INT", scores.intelligence)}

      ${statBox("WIS", scores.wisdom)}

      ${statBox("CHA", scores.charisma)}

    </div>

  `;

}


function statBox(
  name,
  value
) {

  return `

    <div class="stat">

      <strong>
        ${escapeHTML(
          String(value ?? "-")
        )}
      </strong>

      <span>
        ${name}
      </span>

    </div>

  `;

}


function renderStats(
  stats
) {

  if (!stats) {
    return "";
  }

  return `

    <div class="stats">

      ${statBox(
        "AC",
        stats.armorClass
      )}

      ${statBox(
        "HP",
        stats.hitPoints
      )}

      ${statBox(
        "Speed",
        stats.speed
      )}

    </div>

  `;

}


/* =========================================================
   UTILITIES
========================================================= */

function formatTitle(text) {

  return String(text)
    .replace(/([A-Z])/g, " $1")
    .replace(/^./, char => char.toUpperCase());

}


function escapeHTML(value) {

  if (value === null || value === undefined) {
    return "";
  }

  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}

</script>
