<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DM-AI</title>

<style>
* {
    box-sizing: border-box;
}

:root {
    --bg: #080611;
    --panel: #110d1c;
    --panel2: #171124;
    --purple: #8b5cf6;
    --purple2: #6d28d9;
    --light-purple: #c4b5fd;
    --text: #f8f7fb;
    --muted: #9990a8;
    --border: rgba(139,92,246,.24);
    --danger: #ef4444;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    background:
        radial-gradient(
            circle at 20% 0%,
            rgba(124,58,237,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 90% 10%,
            rgba(139,92,246,.12),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #080611,
            #100b19 50%,
            #07050c
        );

    color: var(--text);

    font-family:
        Inter,
        Arial,
        Helvetica,
        sans-serif;
}

button,
textarea {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
    display: flex;
}

/* =====================================================
   SIDEBAR
===================================================== */

.sidebar {
    width: 280px;
    position: fixed;
    left: 0;
    top: 0;
    bottom: 0;

    padding: 22px;

    background:
        linear-gradient(
            180deg,
            rgba(10,7,18,.98),
            rgba(8,6,14,.98)
        );

    border-right:
        1px solid rgba(139,92,246,.22);

    overflow-y: auto;
}

.brand {
    margin-bottom: 25px;
}

.brand-title {
    font-size: 27px;
    font-weight: 900;
    letter-spacing: -.5px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c4b5fd
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.brand-sub {
    margin-top: 5px;
    color: var(--muted);
    font-size: 13px;
}

.new-btn {
    width: 100%;

    border: 1px solid rgba(167,139,250,.4);

    border-radius: 12px;

    padding: 13px 15px;

    color: white;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #5b21b6
        );

    box-shadow:
        0 8px 25px rgba(124,58,237,.2);

    transition: .2s;
}

.new-btn:hover {
    transform: translateY(-1px);
    filter: brightness(1.1);
}

.sidebar-label {
    margin-top: 28px;
    margin-bottom: 10px;

    color: #766d82;

    font-size: 10px;
    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}

.campaign-list {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.campaign-item {
    display: flex;
    align-items: center;

    width: 100%;

    min-height: 42px;

    padding: 7px 7px 7px 11px;

    border:
        1px solid transparent;

    border-radius: 10px;

    color: #c8c1d1;

    background: rgba(255,255,255,.018);

    transition: .18s;
}

.campaign-item:hover {
    background: rgba(139,92,246,.09);
    border-color: rgba(139,92,246,.18);
}

.campaign-item.active {
    background: rgba(139,92,246,.14);
    border-color: rgba(139,92,246,.32);
    color: white;
}

.campaign-name {
    flex: 1;

    min-width: 0;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 13px;

    cursor: pointer;
}

.delete-campaign {
    width: 26px;
    height: 26px;

    flex: 0 0 26px;

    border: none;
    border-radius: 7px;

    background: transparent;

    color: #625a6b;

    font-size: 19px;
    line-height: 1;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: .15s;
}

.delete-campaign:hover {
    color: #f87171;
    background: rgba(239,68,68,.13);
}

/* =====================================================
   MAIN
===================================================== */

.main {
    margin-left: 280px;

    width: calc(100% - 280px);

    min-height: 100vh;

    padding: 28px;
}

.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;

    margin-bottom: 22px;
}

.title-wrap h1 {
    margin: 0;

    font-size: 30px;

    letter-spacing: -.8px;
}

.title-wrap p {
    margin: 6px 0 0;

    color: var(--muted);

    font-size: 14px;
}

/* =====================================================
   WORKSPACE
===================================================== */

.workspace {
    display: grid;

    grid-template-columns:
        minmax(0, 1fr)
        320px;

    gap: 20px;
}

.panel,
.tool-card {
    background:
        linear-gradient(
            145deg,
            rgba(20,15,32,.92),
            rgba(13,10,22,.94)
        );

    border:
        1px solid var(--border);

    box-shadow:
        0 18px 55px rgba(0,0,0,.25);
}

/* =====================================================
   CHAT
===================================================== */

.chat-panel {
    min-height: 610px;

    border-radius: 18px;

    display: flex;

    flex-direction: column;

    overflow: hidden;
}

.panel-header {
    padding: 16px 19px;

    border-bottom:
        1px solid rgba(255,255,255,.06);

    font-weight: 800;

    display: flex;
    align-items: center;
    justify-content: space-between;
}

.online-dot {
    width: 8px;
    height: 8px;

    border-radius: 50%;

    background: #a78bfa;

    box-shadow:
        0 0 12px rgba(167,139,250,.8);
}

.messages {
    flex: 1;

    min-height: 400px;

    max-height: 620px;

    overflow-y: auto;

    padding: 22px;
}

.message {
    display: flex;

    margin-bottom: 16px;
}

.message.user {
    justify-content: flex-end;
}

.message.ai {
    justify-content: flex-start;
}

.message-bubble {
    max-width: 82%;

    padding: 12px 15px;

    border-radius: 14px;

    line-height: 1.55;

    white-space: pre-wrap;

    font-size: 14px;
}

.message.user .message-bubble {
    background:
        linear-gradient(
            135deg,
            #7c3aed,
            #5b21b6
        );

    border-bottom-right-radius: 4px;
}

.message.ai .message-bubble {
    background: rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.07);

    border-bottom-left-radius: 4px;

    color: #d6d0dc;
}

.typing {
    color: #b9a7df !important;
}

.composer {
    padding: 14px;

    border-top:
        1px solid rgba(255,255,255,.06);

    background:
        rgba(5,4,9,.22);
}

.prompt {
    width: 100%;

    min-height: 88px;

    resize: vertical;

    padding: 13px 14px;

    outline: none;

    color: white;

    background: #0a0810;

    border:
        1px solid rgba(139,92,246,.24);

    border-radius: 12px;

    line-height: 1.45;
}

.prompt::placeholder {
    color: #655c70;
}

.prompt:focus {
    border-color: rgba(139,92,246,.7);

    box-shadow:
        0 0 0 3px rgba(139,92,246,.08);
}

.composer-bottom {
    display: flex;

    align-items: center;

    justify-content: space-between;

    margin-top: 10px;
}

.hint {
    color: #62596c;

    font-size: 11px;
}

.generate-btn {
    border: none;

    border-radius: 11px;

    padding: 12px 19px;

    color: white;

    font-weight: 900;

    background:
        linear-gradient(
            135deg,
            #8b5cf6,
            #6d28d9
        );

    box-shadow:
        0 8px 20px rgba(109,40,217,.2);

    transition: .18s;
}

.generate-btn:hover:not(:disabled) {
    transform: translateY(-1px);

    filter: brightness(1.1);
}

.generate-btn:disabled {
    opacity: .55;

    cursor: not-allowed;
}

/* =====================================================
   RIGHT SIDE
===================================================== */

.right-column {
    display: flex;

    flex-direction: column;

    gap: 17px;
}

.tool-card {
    border-radius: 17px;

    padding: 18px;
}

.tool-card h3 {
    margin: 0 0 14px;

    font-size: 15px;

    color: #d8cced;
}

.stat {
    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 9px 0;

    border-bottom:
        1px solid rgba(255,255,255,.045);

    color: #968da1;

    font-size: 13px;
}

.stat:last-child {
    border-bottom: none;
}

.stat strong {
    color: #ddd5e7;
}

.quick-choice {
    width: 100%;

    text-align: left;

    padding: 12px;

    margin-top: 8px;

    border-radius: 11px;

    color: white;

    background: rgba(139,92,246,.07);

    border:
        1px solid rgba(139,92,246,.2);

    transition: .18s;
}

.quick-choice:hover {
    background: rgba(139,92,246,.14);

    border-color:
        rgba(139,92,246,.4);
}

.quick-choice strong {
    display: block;

    margin-bottom: 4px;

    color: #d6c4ff;
}

.quick-choice span {
    color: #81788b;

    font-size: 12px;

    line-height: 1.4;
}

/* =====================================================
   OUTPUT
===================================================== */

.output {
    margin-top: 20px;
}

.hero {
    padding: 25px;

    border-radius: 18px;

    margin-bottom: 18px;

    background:
        radial-gradient(
            circle at top right,
            rgba(139,92,246,.25),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            rgba(109,40,217,.18),
            rgba(17,13,28,.95)
        );

    border:
        1px solid rgba(139,92,246,.32);
}

.hero h2 {
    margin: 0 0 10px;

    font-size: 29px;
}

.hero p {
    margin: 7px 0;

    color: #bcb2c7;

    line-height: 1.6;
}

.section {
    padding: 20px;

    margin-bottom: 17px;

    border-radius: 16px;

    background:
        rgba(16,12,25,.82);

    border:
        1px solid rgba(255,255,255,.065);
}

.section h2 {
    margin: 0 0 17px;

    color: #d7c6f7;

    font-size: 20px;
}

.section h3 {
    color: #bba3ed;

    margin-bottom: 7px;
}

.section p {
    color: #aaa1b3;

    line-height: 1.55;
}

.grid {
    display: grid;

    grid-template-columns:
        repeat(
            auto-fit,
            minmax(245px, 1fr)
        );

    gap: 12px;
}

.info-card {
    padding: 15px;

    border-radius: 13px;

    background:
        rgba(255,255,255,.028);

    border:
        1px solid rgba(255,255,255,.065);
}

.info-card h3 {
    margin-top: 0;

    color: #d4c5eb;
}

.info-card p {
    font-size: 13px;

    color: #a69daa;

    line-height: 1.5;
}

.tag {
    display: inline-block;

    padding: 4px 8px;

    margin: 2px;

    border-radius: 999px;

    color: #cbb8ef;

    background:
        rgba(139,92,246,.1);

    border:
        1px solid rgba(139,92,246,.23);

    font-size: 10px;
}

/* =====================================================
   CHOICES
===================================================== */

.choices {
    display: grid;

    grid-template-columns:
        repeat(2, minmax(0, 1fr));

    gap: 11px;
}

.choice-btn {
    text-align: left;

    min-height: 100px;

    padding: 15px;

    border-radius: 13px;

    color: white;

    background:
        linear-gradient(
            145deg,
            rgba(139,92,246,.1),
            rgba(139,92,246,.035)
        );

    border:
        1px solid rgba(139,92,246,.25);

    transition: .18s;
}

.choice-btn:hover {
    transform: translateY(-2px);

    background:
        rgba(139,92,246,.16);

    border-color:
        rgba(139,92,246,.55);
}

.choice-btn strong {
    display: block;

    color: #d9c8ff;

    margin-bottom: 7px;
}

.choice-btn span {
    color: #9e95a8;

    font-size: 12px;

    line-height: 1.45;
}

/* =====================================================
   EMPTY
===================================================== */

.empty {
    min-height: 400px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    color: #746b7e;
}

.empty-icon {
    font-size: 50px;

    margin-bottom: 10px;

    opacity: .75;
}

.empty h2 {
    margin: 0 0 7px;

    color: #aaa0b5;

    font-size: 20px;
}

.empty p {
    margin: 0;

    font-size: 13px;
}

/* =====================================================
   LOADING
===================================================== */

.loading-box {
    display: flex;

    align-items: center;

    gap: 10px;

    color: #bda7e8;
}

.spinner {
    width: 16px;
    height: 16px;

    border-radius: 50%;

    border:
        2px solid rgba(255,255,255,.12);

    border-top-color:
        #a78bfa;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* =====================================================
   RESPONSIVE
===================================================== */

@media(max-width:1050px) {

    .sidebar {
        width: 230px;
    }

    .main {
        margin-left: 230px;

        width:
            calc(100% - 230px);
    }

    .workspace {
        grid-template-columns: 1fr;
    }

    .right-column {
        display: grid;

        grid-template-columns:
            repeat(2,1fr);
    }
}

@media(max-width:720px) {

    .app {
        display: block;
    }

    .sidebar {
        position: relative;

        width: 100%;

        min-height: auto;

        max-height: 280px;
    }

    .main {
        margin-left: 0;

        width: 100%;

        padding: 15px;
    }

    .right-column {
        display: flex;
    }

    .choices {
        grid-template-columns: 1fr;
    }

    .composer-bottom {
        align-items: flex-end;

        gap: 10px;
    }

    .hint {
        display: none;
    }
}
</style>
</head>

<body>

<div class="app">

<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside class="sidebar">

    <div class="brand">

        <div class="brand-title">
            ⚔️ DM-AI
        </div>

        <div class="brand-sub">
            Your AI Dungeon Master
        </div>

    </div>


    <button
        class="new-btn"
        onclick="newCampaign()"
    >
        ＋ New Campaign
    </button>


    <div class="sidebar-label">
        Your Campaigns
    </div>


    <div
        id="campaignList"
        class="campaign-list"
    ></div>

</aside>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">

    <div class="topbar">

        <div class="title-wrap">

            <h1 id="campaignTitle">
                DM-AI
            </h1>

            <p>
                Build worlds. Create legends. Roll the dice.
            </p>

        </div>

    </div>


    <div class="workspace">


        <!-- =================================================
             CHAT
        ================================================== -->

        <section class="panel chat-panel">

            <div class="panel-header">

                <span>
                    🧙 DM Chat
                </span>

                <span
                    class="online-dot"
                    title="DM-AI ready"
                ></span>

            </div>


            <div
                id="messages"
                class="messages"
            ></div>


            <div class="composer">

                <textarea
                    id="prompt"
                    class="prompt"
                    placeholder="Describe the adventure you want DM-AI to create..."
                ></textarea>


                <div class="composer-bottom">

                    <span class="hint">
                        Press Enter to generate • Shift + Enter for a new line
                    </span>


                    <button
                        id="generateButton"
                        class="generate-btn"
                        onclick="generateCampaign()"
                    >
                        Generate ⚔️
                    </button>

                </div>

            </div>

        </section>


        <!-- =================================================
             RIGHT COLUMN
        ================================================== -->

        <aside class="right-column">


            <div class="tool-card">

                <h3>
                    ⚔️ Campaign Overview
                </h3>


                <div class="stat">
                    <span>Characters</span>
                    <strong id="characterCount">0</strong>
                </div>


                <div class="stat">
                    <span>NPCs</span>
                    <strong id="npcCount">0</strong>
                </div>


                <div class="stat">
                    <span>Monsters</span>
                    <strong id="monsterCount">0</strong>
                </div>


                <div class="stat">
                    <span>Locations</span>
                    <strong id="locationCount">0</strong>
                </div>


                <div class="stat">
                    <span>Quests</span>
                    <strong id="questCount">0</strong>
                </div>


                <div class="stat">
                    <span>Encounters</span>
                    <strong id="encounterCount">0</strong>
                </div>

            </div>


            <div class="tool-card">

                <h3>
                    ✨ Quick Start
                </h3>


                <button
                    class="quick-choice"
                    onclick="useExample(
                        'Create a dark fantasy campaign where an entire village mysteriously disappears overnight.'
                    )"
                >

                    <strong>
                        🌑 Dark Fantasy
                    </strong>

                    <span>
                        Mystery, danger, curses and dark magic.
                    </span>

                </button>


                <button
                    class="quick-choice"
                    onclick="useExample(
                        'Create an epic fantasy campaign involving an ancient dragon, a forgotten kingdom, and a legendary artifact.'
                    )"
                >

                    <strong>
                        🐉 Dragon Quest
                    </strong>

                    <span>
                        Dragons, kingdoms, heroes and legendary treasure.
                    </span>

                </button>


                <button
                    class="quick-choice"
                    onclick="useExample(
                        'Create a horror campaign where the players investigate a haunted town that changes every night.'
                    )"
                >

                    <strong>
                        👻 Horror
                    </strong>

                    <span>
                        A terrifying mystery with supernatural threats.
                    </span>

                </button>

            </div>

        </aside>

    </div>


    <!-- =====================================================
         CAMPAIGN OUTPUT
    ====================================================== -->

    <div
        id="campaignOutput"
        class="output"
    ></div>

</main>

</div>


<script>

/* =========================================================
   STATE
========================================================= */

let campaigns = [];

let currentCampaign = null;

let isGenerating = false;


/* =========================================================
   STORAGE
========================================================= */

function loadCampaigns() {

    try {

        const saved =
            localStorage.getItem(
                "dm_ai_campaigns"
            );

        if (saved) {

            const parsed =
                JSON.parse(saved);

            if (Array.isArray(parsed)) {

                campaigns = parsed;

            }

        }

    } catch (error) {

        console.error(
            "Could not load campaigns:",
            error
        );

        campaigns = [];

    }

}


function saveCampaigns() {

    try {

        localStorage.setItem(
            "dm_ai_campaigns",
            JSON.stringify(campaigns)
        );

    } catch (error) {

        console.error(
            "Could not save campaigns:",
            error
        );

    }

}


/* =========================================================
   HELPERS
========================================================= */

function safeArray(value) {

    return Array.isArray(value)
        ? value
        : [];

}


function safeText(value) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }

    if (
        typeof value === "object"
    ) {

        try {

            return JSON.stringify(value);

        } catch {

            return "";

        }

    }

    return String(value);

}


function escapeHtml(value) {

    return safeText(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* =========================================================
   CAMPAIGN NAME
========================================================= */

function makeCampaignName(prompt) {

    const words =
        prompt
            .replace(/[^\w\s]/g, "")
            .trim()
            .split(/\s+/)
            .filter(Boolean)
            .slice(0, 5);

    if (!words.length) {

        return "New Campaign";

    }

    return words
        .map(word =>
            word.charAt(0).toUpperCase() +
            word.slice(1)
        )
        .join(" ");

}


/* =========================================================
   NEW CAMPAIGN
========================================================= */

function createCampaign() {

    const campaign = {

        id:
            Date.now() +
            Math.floor(
                Math.random() * 10000
            ),

        name:
            "New Campaign",

        messages: []

    };

    campaigns.unshift(campaign);

    currentCampaign = campaign;

    saveCampaigns();

    updateSidebar();

    renderCampaign();

    return campaign;

}


function newCampaign() {

    createCampaign();

    document
        .getElementById("prompt")
        .focus();

}


/* =========================================================
   DELETE CAMPAIGN
========================================================= */

function deleteCampaign(id) {

    const campaign =
        campaigns.find(
            c => c.id === id
        );

    if (!campaign) {

        return;

    }


    const confirmed =
        window.confirm(
            `Delete "${campaign.name || "this campaign"}"?`
        );


    if (!confirmed) {

        return;

    }


    campaigns =
        campaigns.filter(
            c => c.id !== id
        );


    if (
        currentCampaign &&
        currentCampaign.id === id
    ) {

        if (campaigns.length > 0) {

            currentCampaign =
                campaigns[0];

        } else {

            createCampaign();

            return;

        }

    }


    saveCampaigns();

    updateSidebar();

    renderCampaign();

}


/* =========================================================
   SIDEBAR
========================================================= */

function updateSidebar() {

    const list =
        document.getElementById(
            "campaignList"
        );

    list.innerHTML = "";


    if (!campaigns.length) {

        const empty =
            document.createElement("div");

        empty.style.color = "#62596b";

        empty.style.fontSize = "12px";

        empty.textContent =
            "No campaigns yet.";

        list.appendChild(empty);

        return;

    }


    campaigns.forEach(
        campaign => {

            const item =
                document.createElement("div");

            item.className =
                "campaign-item";


            if (
                currentCampaign &&
                campaign.id ===
                currentCampaign.id
            ) {

                item.classList.add(
                    "active"
                );

            }


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "campaign-name";

            name.textContent =
                campaign.name ||
                "New Campaign";


            name.onclick = () => {

                currentCampaign =
                    campaign;

                updateSidebar();

                renderCampaign();

            };


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-campaign";

            deleteButton.textContent =
                "×";

            deleteButton.title =
                "Delete campaign";


            deleteButton.onclick =
                event => {

                    event.stopPropagation();

                    deleteCampaign(
                        campaign.id
                    );

                };


            item.appendChild(name);

            item.appendChild(
                deleteButton
            );

            list.appendChild(item);

        }
    );

}

/* =========================================================
   MESSAGES
========================================================= */

function renderMessages() {

    const container =
        document.getElementById(
            "messages"
        );

    container.innerHTML = "";


    if (
        !currentCampaign ||
        !Array.isArray(
            currentCampaign.messages
        ) ||
        !currentCampaign.messages.length
    ) {

        container.innerHTML = `
            <div class="empty">
                <div class="empty-icon">
                    ⚔️
                </div>

                <h2>
                    Ready, Dungeon Master?
                </h2>

                <p>
                    Describe the adventure you want to create.
                </p>
            </div>
        `;

        return;

    }


    currentCampaign.messages.forEach(
        message => {

            const row =
                document.createElement(
                    "div"
                );

            row.className =
                "message " +
                (
                    message.role === "user"
                        ? "user"
                        : "ai"
                );


            const bubble =
                document.createElement(
                    "div"
                );

            bubble.className =
                "message-bubble";


            if (
                message.loading
            ) {

                bubble.classList.add(
                    "typing"
                );

                bubble.innerHTML = `
                    <div class="loading-box">
                        <div class="spinner"></div>
                        <span>
                            DM-AI is building your adventure...
                        </span>
                    </div>
                `;

            } else {

                bubble.textContent =
                    message.content ||
                    "";

            }


            row.appendChild(bubble);

            container.appendChild(row);

        }
    );


    container.scrollTop =
        container.scrollHeight;

}


/* =========================================================
   RENDER CAMPAIGN
========================================================= */

function renderCampaign() {

    if (!currentCampaign) {

        createCampaign();

        return;

    }


    document.getElementById(
        "campaignTitle"
    ).textContent =
        currentCampaign.name ||
        "DM-AI";


    renderMessages();


    const output =
        document.getElementById(
            "campaignOutput"
        );


    const generated =
        Array.isArray(
            currentCampaign.messages
        )
            ? currentCampaign.messages
                .filter(
                    message =>
                        message.role === "ai" &&
                        message.data
                )
            : [];


    if (!generated.length) {

        output.innerHTML = "";

        updateStats(null);

        return;

    }


    const campaign =
        generated[
            generated.length - 1
        ].data;


    renderCampaignData(
        campaign
    );

}

/* =========================================================
   CHOICE ACTION
========================================================= */

async function chooseAction(index) {

    if (
        !currentCampaign ||
        isGenerating
    ) {

        return;

    }


    const generated =
        currentCampaign.messages
            .filter(
                message =>
                    message.role === "ai" &&
                    message.data
            );


    if (!generated.length) {

        return;

    }


    const campaign =
        generated[
            generated.length - 1
        ].data;


    const choices =
        safeArray(
            campaign.choices
        );


    const choice =
        choices[index];


    if (!choice) {

        return;

    }


    const prompt =
        `I choose "${safeText(choice.label)}".

${safeText(choice.description)}

Continue the adventure from this decision. Keep the existing characters, NPCs, locations, factions, quests, monsters, and story consistent. Update the story based on this choice and give me four new meaningful choices.`;


    document.getElementById(
        "prompt"
    ).value = prompt;


    await generateCampaign();

}


/* =========================================================
   GENERATE
========================================================= */

async function generateCampaign() {

    if (isGenerating) {

        return;

    }


    const input =
        document.getElementById(
            "prompt"
        );


    const button =
        document.getElementById(
            "generateButton"
        );


    const prompt =
        input.value.trim();


    if (!prompt) {

        input.focus();

        return;

    }


    if (!currentCampaign) {

        createCampaign();

    }


    isGenerating = true;

    button.disabled = true;

    button.textContent =
        "⚔️ Building...";


    /* USER MESSAGE */

    currentCampaign.messages =
        Array.isArray(
            currentCampaign.messages
        )
            ? currentCampaign.messages
            : [];


    currentCampaign.messages.push({

        role: "user",

        content: prompt

    });


    /* NAME */

    if (
        !currentCampaign.name ||
        currentCampaign.name ===
        "New Campaign"
    ) {

        currentCampaign.name =
            makeCampaignName(
                prompt
            );

    }


    input.value = "";


    /* LOADING */

    currentCampaign.messages.push({

        role: "ai",

        loading: true,

        content:
            "DM-AI is building your adventure..."

    });


    saveCampaigns();

    updateSidebar();

    renderCampaign();


    try {

        const controller =
            new AbortController();


        const timeout =
            setTimeout(
                () => {
                    controller.abort();
                },
                90000
            );


        const response =
            await fetch(
                "/api/generate",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "Accept":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            prompt: prompt
                        }),

                    signal:
                        controller.signal
                }
            );


        clearTimeout(timeout);


        const raw =
            await response.text();


        console.log(
            "DM-AI SERVER RESPONSE:",
            raw
        );


        let data;


        try {

            data =
                JSON.parse(raw);

        } catch {

            throw new Error(
                "The server did not return valid JSON. Check the Vercel function logs."
            );

        }


        if (!response.ok) {

            throw new Error(
                data.details ||
                data.error ||
                `Server returned ${response.status}`
            );

        }


        if (
            data.success !== true
        ) {

            throw new Error(
                data.details ||
                data.error ||
                "DM-AI failed to generate the campaign."
            );

        }


        let campaign =
            data.result;


        if (
            typeof campaign ===
            "string"
        ) {

            campaign =
                JSON.parse(
                    campaign
                );

        }


        if (
            !campaign ||
            typeof campaign !==
            "object"
        ) {

            throw new Error(
                "DM-AI returned an empty campaign."
            );

        }


        /*
         * REMOVE LOADING MESSAGE
         */

        currentCampaign.messages =
            currentCampaign.messages
                .filter(
                    message =>
                        !message.loading
                );


        /*
         * ADD GENERATED CAMPAIGN
         */

        currentCampaign.messages.push({

            role: "ai",

            content:
                "Campaign generated successfully.",

            data:
                campaign

        });


        /*
         * Make sure four choices exist.
         */

        if (
            !Array.isArray(
                campaign.choices
            )
        ) {

            campaign.choices = [];

        }


        while (
            campaign.choices.length < 4
        ) {

            campaign.choices.push({

                label:
                    "Continue the adventure",

                description:
                    "Continue the story and see what happens next."

            });

        }


        campaign.choices =
            campaign.choices.slice(
                0,
                4
            );


        /*
         * Update campaign title
         */

        if (
            campaign.title
        ) {

            currentCampaign.name =
                campaign.title;

        }


        saveCampaigns();

        updateSidebar();

        renderCampaign();


    } catch (error) {

        console.error(
            "DM-AI GENERATION ERROR:",
            error
        );


        /*
         * Remove loading message.
         */

        currentCampaign.messages =
            currentCampaign.messages
                .filter(
                    message =>
                        !message.loading
                );


        let errorMessage =
            error.message ||
            "Unknown error";


        if (
            error.name ===
            "AbortError"
        ) {

            errorMessage =
                "The AI request timed out after 90 seconds.";

        }


        currentCampaign.messages.push({

            role: "ai",

            content:
                `⚠️ DM-AI ERROR

${errorMessage}

Check your Vercel deployment and the GEMINI_API_KEY environment variable.`

        });


        saveCampaigns();

        renderCampaign();

    }


    isGenerating = false;

    button.disabled = false;

    button.textContent =
        "Generate ⚔️";

}


/* =========================================================
   ENTER KEY
========================================================= */

document
    .getElementById("prompt")
    .addEventListener(
        "keydown",
        event => {

            if (
                event.key === "Enter" &&
                !event.shiftKey
            ) {

                event.preventDefault();

                generateCampaign();

            }

        }
    );


/* =========================================================
   INITIALIZE
========================================================= */

loadCampaigns();


if (campaigns.length) {

    currentCampaign =
        campaigns[0];

} else {

    createCampaign();

}


updateSidebar();

renderCampaign();

</script>

</body>
</html>
