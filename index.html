<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DM-AI</title>

<style>

/* =========================================================
   RESET
========================================================= */

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    color: #f5f0e6;

    background:
        radial-gradient(
            circle at top,
            rgba(100, 60, 150, .35),
            transparent 45%
        ),
        linear-gradient(
            135deg,
            #09070d,
            #15101d 50%,
            #09070d
        );

    overflow: hidden;
}


/* =========================================================
   FANTASY BACKGROUND
========================================================= */

.emoji {
    position: fixed;
    opacity: .08;
    pointer-events: none;
    z-index: 0;
    user-select: none;
    filter: grayscale(25%);
}

.e1 {
    top: 8%;
    left: 4%;
    font-size: 80px;
    transform: rotate(-18deg);
}

.e2 {
    top: 22%;
    right: 5%;
    font-size: 90px;
    transform: rotate(20deg);
}

.e3 {
    top: 48%;
    left: 2%;
    font-size: 75px;
    transform: rotate(12deg);
}

.e4 {
    top: 65%;
    right: 3%;
    font-size: 85px;
    transform: rotate(-15deg);
}

.e5 {
    bottom: 5%;
    left: 8%;
    font-size: 70px;
    transform: rotate(15deg);
}

.e6 {
    bottom: 12%;
    right: 10%;
    font-size: 75px;
    transform: rotate(-20deg);
}


/* =========================================================
   APP
========================================================= */

.app {
    position: relative;
    z-index: 1;

    display: flex;

    width: 100%;
    height: 100vh;
}


/* =========================================================
   SIDEBAR
========================================================= */

.sidebar {
    width: 270px;
    height: 100vh;

    flex-shrink: 0;

    display: flex;
    flex-direction: column;

    background:
        rgba(15, 10, 22, .96);

    border-right:
        1px solid rgba(180, 130, 255, .18);

    backdrop-filter: blur(15px);
}

.sidebar-header {
    padding: 22px;

    border-bottom:
        1px solid rgba(255,255,255,.07);
}

.sidebar-logo {
    font-size: 25px;
    font-weight: 900;

    margin-bottom: 18px;

    background:
        linear-gradient(
            90deg,
            #ffffff,
            #c9a7ff,
            #ffffff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.new-campaign {
    width: 100%;

    padding: 12px;

    border: 1px solid
        rgba(165,108,255,.35);

    border-radius: 11px;

    background:
        linear-gradient(
            135deg,
            #7547d9,
            #a56cff
        );

    color: white;

    font-weight: bold;
    font-size: 14px;

    cursor: pointer;

    transition: .2s;
}

.new-campaign:hover {
    transform: translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(140,90,255,.3);
}

.history-title {
    padding:
        18px
        18px
        8px;

    color: #807789;

    font-size: 11px;

    text-transform: uppercase;

    letter-spacing: 1.5px;
}

.chat-list {
    flex: 1;

    overflow-y: auto;

    padding: 6px 10px;
}

.chat-item {
    display: flex;

    align-items: center;

    gap: 5px;

    padding: 12px;

    margin-bottom: 4px;

    border-radius: 10px;

    cursor: pointer;

    transition: .2s;
}

.chat-item:hover {
    background:
        rgba(165,108,255,.08);
}

.chat-item.active {
    background:
        rgba(165,108,255,.15);

    border:
        1px solid
        rgba(165,108,255,.15);
}

.chat-name {
    flex: 1;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    color: #d6cedd;

    font-size: 13px;
}

.delete-chat {
    border: none;

    background: none;

    color: #6e6675;

    cursor: pointer;

    opacity: 0;

    transition: .2s;
}

.chat-item:hover .delete-chat {
    opacity: 1;
}

.delete-chat:hover {
    color: #ff6c7c;
}


/* =========================================================
   MAIN
========================================================= */

.main {
    flex: 1;

    min-width: 0;

    height: 100vh;

    display: flex;

    flex-direction: column;
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar {
    height: 65px;

    flex-shrink: 0;

    display: flex;

    align-items: center;

    padding: 0 25px;

    background:
        rgba(9,7,13,.82);

    border-bottom:
        1px solid
        rgba(180,130,255,.13);

    backdrop-filter: blur(10px);
}

.mobile-menu {
    display: none;

    margin-right: 15px;

    border: none;

    background: none;

    color: white;

    font-size: 24px;

    cursor: pointer;
}

.campaign-title-bar {
    color: #ddd4e5;

    font-size: 15px;

    font-weight: 600;
}


/* =========================================================
   CHAT AREA
========================================================= */

.chat-area {
    flex: 1;

    overflow-y: auto;

    padding:
        40px 30px
        50px;

    scroll-behavior: smooth;
}

.chat-inner {
    width: min(1000px, 100%);
    margin: auto;
}


/* =========================================================
   WELCOME
========================================================= */

.welcome {
    width: min(850px, 100%);

    margin:
        5vh auto
        0;

    text-align: center;
}

.welcome-icon {
    font-size: 55px;

    margin-bottom: 15px;

    filter:
        drop-shadow(
            0 0 20px
            rgba(165,108,255,.35)
        );
}

.welcome h1 {
    margin: 0 0 10px;

    font-size: 40px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #c9a7ff,
            #fff
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.welcome p {
    margin: 0 0 32px;

    color: #aaa2b5;

    font-size: 16px;
}


/* =========================================================
   FOUR CHOICES
========================================================= */

.examples {
    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 13px;

    text-align: left;
}

.example {
    padding: 18px;

    background:
        rgba(18,14,25,.86);

    border:
        1px solid
        rgba(190,160,255,.16);

    border-radius: 15px;

    cursor: pointer;

    transition: .2s;

    backdrop-filter: blur(8px);
}

.example:hover {
    transform:
        translateY(-3px);

    border-color:
        rgba(165,108,255,.45);

    box-shadow:
        0 10px 35px
        rgba(100,50,180,.15);

    background:
        rgba(30,20,42,.95);
}

.example-title {
    color: #e5d9f5;

    font-weight: bold;

    margin-bottom: 7px;
}

.example-text {
    color: #918899;

    font-size: 13px;

    line-height: 1.5;
}


/* =========================================================
   MESSAGES
========================================================= */

.message {
    width: 100%;

    margin-bottom: 28px;
}

.message-label {
    margin-bottom: 7px;

    color: #8f7ba8;

    font-size: 10px;

    font-weight: bold;

    letter-spacing: 1px;
}

.message-user {
    width: fit-content;

    max-width: 78%;

    margin-left: auto;

    padding:
        14px 17px;

    background:
        linear-gradient(
            135deg,
            rgba(105,65,170,.3),
            rgba(40,25,55,.9)
        );

    border:
        1px solid
        rgba(165,108,255,.2);

    border-radius:
        15px
        15px
        4px
        15px;

    color: #eee6f5;

    line-height: 1.6;

    white-space: pre-wrap;
}

.message-ai {
    color: #d4ccd9;

    line-height: 1.7;
}


/* =========================================================
   CAMPAIGN RESULT
========================================================= */

.campaign-result {
    width: 100%;
}

.campaign-header {
    padding: 30px;

    margin-bottom: 20px;

    background:
        linear-gradient(
            135deg,
            rgba(105,65,170,.32),
            rgba(30,20,45,.92)
        );

    border:
        1px solid
        rgba(180,140,255,.25);

    border-radius: 20px;

    box-shadow:
        0 15px 45px
        rgba(0,0,0,.2);
}

.campaign-header h1 {
    margin:
        0 0 10px;

    font-size: 34px;

    color: #eee5f8;
}

.campaign-header p {
    color: #c5becd;

    line-height: 1.7;
}

.tags {
    display: flex;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 18px;
}

.tag {
    padding:
        7px 12px;

    background:
        rgba(165,108,255,.12);

    border:
        1px solid
        rgba(165,108,255,.25);

    border-radius: 50px;

    color: #d8c7ff;

    font-size: 12px;
}


/* =========================================================
   SECTIONS
========================================================= */

.section {
    margin-bottom: 18px;

    padding: 23px;

    background:
        rgba(18,14,25,.9);

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 18px;

    box-shadow:
        0 10px 35px
        rgba(0,0,0,.12);
}

.section-title {
    margin:
        0 0 18px;

    color: #e5d9f5;

    font-size: 21px;
}

.story {
    color: #d1cad7;

    line-height: 1.8;

    white-space: pre-wrap;
}


/* =========================================================
   CARDS
========================================================= */

.grid {
    display: grid;

    grid-template-columns:
        repeat(auto-fit, minmax(260px, 1fr));

    gap: 13px;
}

.card {
    padding: 17px;

    background:
        rgba(8,7,12,.72);

    border:
        1px solid
        rgba(255,255,255,.07);

    border-radius: 13px;

    transition: .2s;
}

.card:hover {
    transform:
        translateY(-2px);

    border-color:
        rgba(165,108,255,.3);
}

.card h3 {
    margin:
        0 0 9px;

    color: #e7dbff;

    font-size: 16px;
}

.card p {
    color: #b8b0bd;

    line-height: 1.6;

    white-space: pre-wrap;
}

.label {
    margin-top: 12px;
    margin-bottom: 4px;

    color: #a47bdd;

    font-size: 11px;

    font-weight: bold;

    text-transform: uppercase;

    letter-spacing: .5px;
}

.card ul {
    padding-left: 20px;

    color: #c2bbc7;

    line-height: 1.65;
}


/* =========================================================
   STATS
========================================================= */

.stats {
    display: grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap: 7px;

    margin-top: 12px;
}

.stat {
    padding: 9px;

    background:
        #100d15;

    border-radius: 8px;

    text-align: center;
}

.stat strong {
    display: block;

    color: #e5d9f5;

    font-size: 17px;
}

.stat span {
    color: #817888;

    font-size: 9px;

    text-transform: uppercase;
}


/* =========================================================
   BOSS
========================================================= */

.boss {
    border-color:
        rgba(255,80,80,.25);

    background:
        linear-gradient(
            135deg,
            rgba(80,15,20,.35),
            rgba(15,10,15,.9)
        );
}

.boss h3 {
    color: #ffb0b0;
}


/* =========================================================
   INPUT AREA
========================================================= */

.input-section {
    flex-shrink: 0;

    padding:
        15px 25px 20px;

    background:
        linear-gradient(
            transparent,
            #09070d 35%
        );
}

.input-container {
    width: min(900px, 100%);

    margin: auto;

    padding: 12px;

    background:
        rgba(20,15,28,.94);

    border:
        1px solid
        rgba(190,160,255,.2);

    border-radius: 17px;

    box-shadow:
        0 -10px 40px
        rgba(0,0,0,.18);

    backdrop-filter: blur(12px);
}

#prompt {
    display: block;

    width: 100%;

    min-height: 65px;
    max-height: 180px;

    padding: 8px;

    resize: none;

    background: transparent;

    border: none;

    outline: none;

    color: white;

    font-family: inherit;

    font-size: 15px;

    line-height: 1.5;
}

#prompt::placeholder {
    color: #706777;
}

.input-bottom {
    display: flex;

    align-items: center;

    justify-content: space-between;

    gap: 10px;
}

.hint {
    color: #68606f;

    font-size: 11px;
}

.generate {
    padding:
        10px 17px;

    border: none;

    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #7547d9,
            #a56cff
        );

    color: white;

    font-weight: bold;

    cursor: pointer;

    transition: .2s;
}

.generate:hover {
    transform:
        translateY(-2px);

    box-shadow:
        0 8px 25px
        rgba(140,90,255,.3);
}

.generate:disabled {
    opacity: .55;

    cursor: wait;

    transform: none;
}


/* =========================================================
   STATUS
========================================================= */

#status {
    display: none;

    padding: 15px;

    text-align: center;

    color: #c7b5e8;

    font-size: 13px;
}

.loader {
    display: inline-block;

    width: 16px;
    height: 16px;

    margin-right: 7px;

    vertical-align: middle;

    border:
        3px solid
        rgba(255,255,255,.15);

    border-top-color:
        #a56cff;

    border-radius: 50%;

    animation:
        spin .8s linear infinite;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}


/* =========================================================
   ERROR
========================================================= */

#error {
    display: none;

    margin-top: 10px;

    padding: 13px;

    background:
        rgba(100,20,30,.25);

    border:
        1px solid
        rgba(255,80,100,.3);

    border-radius: 10px;

    color: #ffb4bd;

    font-size: 13px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:700px) {

    .sidebar {
        position: fixed;

        left: 0;
        top: 0;
        bottom: 0;

        z-index: 20;

        transform:
            translateX(-100%);

        transition: .25s;
    }

    .sidebar.open {
        transform:
            translateX(0);
    }

    .mobile-menu {
        display: block;
    }

    .chat-area {
        padding:
            25px 15px 35px;
    }

    .input-section {
        padding:
            10px 12px 12px;
    }

    .examples {
        grid-template-columns: 1fr;
    }

    .welcome h1 {
        font-size: 31px;
    }

    .message-user {
        max-width: 90%;
    }

    .hint {
        display: none;
    }

    .grid {
        grid-template-columns: 1fr;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     FANTASY BACKGROUND
===================================================== -->

<div class="emoji e1">⚔️</div>
<div class="emoji e2">🛡️</div>
<div class="emoji e3">♞</div>
<div class="emoji e4">⚔️</div>
<div class="emoji e5">🛡️</div>
<div class="emoji e6">♟️</div>


<div class="app">


<!-- =====================================================
     SIDEBAR
===================================================== -->

<aside
    class="sidebar"
    id="sidebar"
>

    <div class="sidebar-header">

        <div class="sidebar-logo">
            ⚔️ DM-AI 🛡️
        </div>

        <button
            class="new-campaign"
            onclick="newCampaign()"
        >
            + New Campaign
        </button>

    </div>


    <div class="history-title">
        Campaigns
    </div>


    <div
        class="chat-list"
        id="chatList"
    ></div>

</aside>



<!-- =====================================================
     MAIN
===================================================== -->

<main class="main">


    <!-- TOP BAR -->

    <div class="topbar">

        <button
            class="mobile-menu"
            onclick="toggleSidebar()"
        >
            ☰
        </button>

        <div
            class="campaign-title-bar"
            id="campaignTitle"
        >
            New Campaign
        </div>

    </div>



    <!-- CHAT -->

    <div
        class="chat-area"
        id="chatArea"
    ></div>



    <!-- CHAT BOX -->

    <div class="input-section">

        <div class="input-container">

            <textarea
                id="prompt"
                placeholder="Describe your adventure, character, NPC, monster, quest, or campaign..."
            ></textarea>


            <div class="input-bottom">

                <div class="hint">
                    Enter to generate • Shift + Enter for a new line
                </div>

                <button
                    class="generate"
                    id="generateButton"
                    onclick="generateCampaign()"
                >
                    ⚔️ Generate
                </button>

            </div>

        </div>

    </div>


</main>

</div>



<script>

/* =========================================================
   DATA
========================================================= */

let campaigns = [];

let currentCampaign = null;

let isGenerating = false;


/* =========================================================
   STORAGE
========================================================= */

function loadCampaigns() {

    try {

        const saved =
            localStorage.getItem(
                "dm_ai_campaigns"
            );

        if (saved) {

            campaigns =
                JSON.parse(saved);

        }

    } catch (error) {

        console.error(error);

        campaigns = [];

    }

}


function saveCampaigns() {

    localStorage.setItem(
        "dm_ai_campaigns",
        JSON.stringify(campaigns)
    );

}


/* =========================================================
   NEW CAMPAIGN
========================================================= */

function newCampaign() {

    const campaign = {

        id: Date.now(),

        name: "New Campaign",

        messages: []

    };

    campaigns.unshift(campaign);

    currentCampaign = campaign;

    saveCampaigns();

    updateSidebar();

    renderCampaign();

    document
        .getElementById("prompt")
        .focus();

    closeMobileSidebar();

}


/* =========================================================
   SIDEBAR
========================================================= */

function updateSidebar() {

    const list =
        document.getElementById(
            "chatList"
        );

    list.innerHTML = "";


    campaigns.forEach(
        campaign => {

            const item =
                document.createElement(
                    "div"
                );

            item.className =
                "chat-item " +
                (
                    currentCampaign &&
                    currentCampaign.id ===
                    campaign.id
                        ? "active"
                        : ""
                );


            const name =
                document.createElement(
                    "div"
                );

            name.className =
                "chat-name";

            name.textContent =
                "⚔️ " +
                campaign.name;

            name.onclick = () => {

                selectCampaign(
                    campaign.id
                );

            };


            const deleteButton =
                document.createElement(
                    "button"
                );

            deleteButton.className =
                "delete-chat";

            deleteButton.textContent =
                "✕";

            deleteButton.onclick =
                event => {

                    event.stopPropagation();

                    deleteCampaign(
                        campaign.id
                    );

                };


            item.appendChild(name);

            item.appendChild(
                deleteButton
            );

            list.appendChild(item);

        }
    );

}


function selectCampaign(id) {

    currentCampaign =
        campaigns.find(
            campaign =>
                campaign.id === id
        );

    if (!currentCampaign) {
        return;
    }

    updateSidebar();

    renderCampaign();

    closeMobileSidebar();

}


function deleteCampaign(id) {

    if (
        !confirm(
            "Delete this campaign?"
        )
    ) {
        return;
    }


    campaigns =
        campaigns.filter(
            campaign =>
                campaign.id !== id
        );


    if (
        currentCampaign &&
        currentCampaign.id === id
    ) {

        currentCampaign =
            campaigns.length
                ? campaigns[0]
                : null;

    }


    saveCampaigns();


    if (!currentCampaign) {

        newCampaign();

    } else {

        updateSidebar();

        renderCampaign();

    }

}


/* =========================================================
   RENDER MAIN CHAT
========================================================= */

function renderCampaign() {

    const area =
        document.getElementById(
            "chatArea"
        );

    const title =
        document.getElementById(
            "campaignTitle"
        );


    if (!currentCampaign) {

        area.innerHTML = "";

        title.textContent =
            "New Campaign";

        return;

    }


    title.textContent =
        currentCampaign.name;


    /* EMPTY CAMPAIGN */

    if (
        !currentCampaign.messages ||
        currentCampaign.messages.length === 0
    ) {

        area.innerHTML = `

            <div class="chat-inner">

                <div class="welcome">

                    <div class="welcome-icon">
                        🧙‍♂️
                    </div>

                    <h1>
                        What do you want to create?
                    </h1>

                    <p>
                        Build campaigns, characters, NPCs,
                        monsters, quests and entire worlds.
                    </p>


                    <div class="examples">


                        <div
                            class="example"
                            onclick="useExample(this)"
                        >

                            <div class="example-title">
                                🐉 Epic Fantasy
                            </div>

                            <div class="example-text">
                                Create an epic fantasy campaign involving an ancient dragon returning after 1,000 years.
                            </div>

                        </div>


                        <div
                            class="example"
                            onclick="useExample(this)"
                        >

                            <div class="example-title">
                                🩸 Dark Horror
                            </div>

                            <div class="example-text">
                                Create a dark horror campaign where an entire village mysteriously disappears.
                            </div>

                        </div>


                        <div
                            class="example"
                            onclick="useExample(this)"
                        >

                            <div class="example-title">
                                🏰 Political Intrigue
                            </div>

                            <div class="example-text">
                                Create a campaign centered around rival kingdoms preparing for war.
                            </div>

                        </div>


                        <div
                            class="example"
                            onclick="useExample(this)"
                        >

                            <div class="example-title">
                                🗡️ Dungeon Adventure
                            </div>

                            <div class="example-text">
                                Create a dangerous dungeon filled with traps, monsters, treasure and a powerful boss.
                            </div>

                        </div>


                    </div>

                </div>

            </div>

        `;

        return;

    }


    /* EXISTING CHAT */

    area.innerHTML = `

        <div
            class="chat-inner"
            id="chatMessages"
        ></div>

    `;


    const chatMessages =
        document.getElementById(
            "chatMessages"
        );


    currentCampaign.messages.forEach(
        message => {

            const wrapper =
                document.createElement(
                    "div"
                );

            wrapper.className =
                "message";


            /* USER */

            if (
                message.role === "user"
            ) {

                wrapper.innerHTML = `

                    <div class="message-label">
                        YOU
                    </div>

                    <div class="message-user"></div>

                `;


                wrapper
                    .querySelector(
                        ".message-user"
                    )
                    .textContent =
                        message.content;

            }


            /* AI */

            else {

                wrapper.innerHTML = `

                    <div class="message-label">
                        DM-AI
                    </div>

                    <div class="message-ai"></div>

                `;


                const aiBox =
                    wrapper.querySelector(
                        ".message-ai"
                    );


                if (
                    message.data &&
                    typeof message.data ===
                    "object"
                ) {

                    aiBox.appendChild(
                        renderCampaignData(
                            message.data
                        )
                    );

                } else {

                    aiBox.textContent =
                        message.content ||
                        "";

                }

            }


            chatMessages.appendChild(
                wrapper
            );

        }
    );


    area.scrollTop =
        area.scrollHeight;

}

function renderCampaignData(data) {

    if (

function addTextSection(
    parent,
    icon,
    title,
    text
) {

    const section =
        document.createElement(
            "section"
        );

    section.className =
        "section";


    section.innerHTML = `

        <h2 class="section-title">
            ${icon}
            ${title}
        </h2>

        <div class="story">
            ${escapeHTML(
                text || ""
            )}
        </div>

    `;


    parent.appendChild(
        section
    );

}


/* =========================================================
   CARD SECTION
========================================================= */

function renderCards(
    parent,
    icon,
    title,
    items,
    renderer
) {

    if (
        !Array.isArray(items) ||
        items.length === 0
    ) {

        return;

    }


    const section =
        document.createElement(
            "section"
        );

    section.className =
        "section";


    section.innerHTML = `

        <h2 class="section-title">
            ${icon}
            ${title}
        </h2>

    `;


    const grid =
        document.createElement(
            "div"
        );

    grid.className =
        "grid";


    items.forEach(
        item => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "card";

            card.innerHTML =
                renderer(item);

            grid.appendChild(
                card
            );

        }
    );


    section.appendChild(
        grid
    );


    parent.appendChild(
        section
    );

}


/* =========================================================
   LIST
========================================================= */

function renderList(
    title,
    items
) {

    if (
        !items ||
        !Array.isArray(items) ||
        items.length === 0
    ) {

        return "";

    }


    return `

        <div class="label">
            ${escapeHTML(title)}
        </div>

        <ul>

            ${
                items.map(
                    item => {

                        const value =
                            typeof item ===
                            "string"
                                ? item
                                : JSON.stringify(
                                    item
                                );

                        return `

                            <li>
                                ${escapeHTML(
                                    value
                                )}
                            </li>

                        `;

                    }
                ).join("")
            }

        </ul>

    `;

}

/* =========================================================
   GENERATE
========================================================= */

async function generateCampaign() {

    if (isGenerating) {
        return;
    }


    const input =
        document.getElementById(
            "prompt"
        );

    const button =
        document.getElementById(
            "generateButton"
        );

    const status =
        document.getElementById(
            "status"
        );

    const errorBox =
        document.getElementById(
            "error"
        );


    const prompt =
        input.value.trim();


    if (!prompt) {

        input.focus();

        return;

    }


    if (!currentCampaign) {

        newCampaign();

    }


    /* USER MESSAGE */

    currentCampaign.messages.push({

        role: "user",

        content: prompt

    });


    /* NAME */

    if (
        currentCampaign.name ===
        "New Campaign"
    ) {

        currentCampaign.name =
            createCampaignName(
                prompt
            );

    }


    input.value = "";

    input.style.height =
        "65px";


    saveCampaigns();

    updateSidebar();

    renderCampaign();


    isGenerating = true;

    button.disabled = true;

    button.textContent =
        "⚔️ Building...";


    try {

        const response =
            await fetch(
                "/api/generate",
                {

                    method: "POST",

                    headers: {

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify({

                            prompt:
                                prompt

                        })

                }
            );


        const data =
            await response.json();


        console.log(
            "DM-AI RESPONSE:",
            data
        );


        if (
            !response.ok
        ) {

            throw new Error(

                data.error ||

                data.details ||

                "DM-AI could not generate a response."

            );

        }


        /*
          SUPPORT BOTH:

          data.campaign

          AND

          data.result
        */

        let campaign =
            data.campaign;


        if (
            !campaign &&
            data.result
        ) {

            campaign =
                data.result;

        }


        /*
          If Gemini returned JSON
          as a string, parse it.
        */

        if (
            typeof campaign ===
            "string"
        ) {

            try {

                campaign =
                    JSON.parse(
                        campaign
                    );

            } catch {

                /*
                  Keep normal text.
                */

            }

        }


        if (!campaign) {

            throw new Error(
                "No campaign data was returned."
            );

        }


        currentCampaign.messages.push({

            role: "ai",

            content: "",

            data: campaign

        });


        saveCampaigns();

        updateSidebar();

        renderCampaign();


    } catch (error) {

        console.error(
            "DM-AI ERROR:",
            error
        );


        currentCampaign.messages.push({

            role: "ai",

            content:
                "⚠️ " +
                error.message

        });


        saveCampaigns();

        renderCampaign();

    }


    isGenerating = false;

    button.disabled = false;

    button.textContent =
        "⚔️ Generate";

}


/* =========================================================
   CAMPAIGN NAME
========================================================= */

function createCampaignName(
    prompt
) {

    let name =
        prompt
            .replace(
                /\s+/g,
                " "
            )
            .trim();


    if (
        name.length > 32
    ) {

        name =
            name.substring(
                0,
                32
            ) +
            "...";

    }


    return name;

}


/* =========================================================
   ENTER
========================================================= */

function handleKey(
    event
) {

    if (
        event.key ===
        "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        generateCampaign();

    }

}


/* =========================================================
   MOBILE
========================================================= */

function toggleSidebar() {

    document
        .getElementById(
            "sidebar"
        )
        .classList.toggle(
            "open"
        );

}


function closeMobileSidebar() {

    document
        .getElementById(
            "sidebar"
        )
        .classList.remove(
            "open"
        );

}


/* =========================================================
   TEXTAREA
========================================================= */

document
    .getElementById("prompt")
    .addEventListener(
        "input",
        function() {

            this.style.height =
                "auto";

            this.style.height =
                Math.min(
                    this.scrollHeight,
                    180
                ) + "px";

        }
    );


document
    .getElementById("prompt")
    .addEventListener(
        "keydown",
        handleKey
    );


/* =========================================================
   INITIALIZE
========================================================= */

loadCampaigns();


if (
    campaigns.length === 0
) {

    newCampaign();

} else {

    currentCampaign =
        campaigns[0];

    updateSidebar();

    renderCampaign();

}

</script>
