<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DM-AI</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0
}

:root{
    --bg:#0d0913;
    --panel:#100b17;
    --line:#332343;
    --purple:#7c3aed;
    --purple2:#a855f7;
    --text:#f5f3f7;
    --muted:#9d93a8;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:
        radial-gradient(
            circle at 70% 10%,
            rgba(126,58,237,.18),
            transparent 30%
        ),
        radial-gradient(
            circle at 30% 80%,
            rgba(91,33,182,.11),
            transparent 32%
        ),
        var(--bg);
    color:var(--text);
    height:100vh;
    overflow:hidden;
}

button,
textarea{
    font:inherit;
}

.app{
    height:100vh;
    display:flex;
    position:relative;
    z-index:1;
}

/* BACKGROUND */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    opacity:.06;
}

.bg span{
    position:absolute;
    font-size:55px;
    animation:float 12s ease-in-out infinite;
}

.b1{top:8%;left:25%}
.b2{top:24%;right:8%;animation-delay:2s}
.b3{bottom:14%;left:20%;animation-delay:4s}
.b4{bottom:22%;right:18%;animation-delay:1s}
.b5{top:54%;left:5%;animation-delay:3s}
.b6{top:7%;right:30%;animation-delay:5s}
.b7{bottom:5%;right:5%;animation-delay:6s}
.b8{top:40%;right:40%;animation-delay:2s}

@keyframes float{
    50%{
        transform:translateY(-20px) rotate(5deg)
    }
}

/* SIDEBAR */

.sidebar{
    width:270px;
    flex:none;
    background:rgba(16,11,23,.98);
    border-right:1px solid var(--line);
    display:flex;
    flex-direction:column;
}

.sidebar-head{
    padding:20px 16px;
    border-bottom:1px solid var(--line);
}

.logo{
    font-size:25px;
    font-weight:800;
    margin:0 4px 18px;
}

.logo small{
    color:#c9a7ff;
    font-size:18px;
}

.new{
    width:100%;
    border:0;
    border-radius:11px;
    padding:12px;
    background:linear-gradient(
        135deg,
        var(--purple),
        var(--purple2)
    );
    color:white;
    font-weight:800;
    cursor:pointer;
}

.new:hover{
    filter:brightness(1.08);
}

.history{
    padding:18px 14px 9px;
    color:#81758d;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:1.2px;
}

.list{
    padding:5px 8px;
    overflow:auto;
    flex:1;
}

.item{
    display:flex;
    align-items:center;
    gap:7px;
    padding:10px 8px;
    border-radius:10px;
    margin-bottom:4px;
    border:1px solid transparent;
}

.item:hover{
    background:#21172a;
}

.item.active{
    background:rgba(124,58,237,.19);
    border-color:rgba(168,85,247,.3);
}

.name{
    min-width:0;
    flex:1;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    font-size:13px;
    cursor:pointer;
}

.del{
    width:26px;
    height:26px;
    border:0;
    border-radius:7px;
    background:transparent;
    color:#8c8098;
    cursor:pointer;
    opacity:.85;
}

.del:hover{
    background:#3a1825;
    color:#ff6b81;
}

/* MAIN */

.main{
    min-width:0;
    flex:1;
    display:flex;
    flex-direction:column;
}

.top{
    height:60px;
    flex:none;
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    padding:0 24px;
    background:rgba(13,9,19,.86);
}

.mobile{
    display:none;
    border:0;
    background:none;
    color:white;
    font-size:24px;
    margin-right:12px;
}

.title{
    font-weight:700;
    color:#ddd;
}

/* CHAT */

.chat{
    flex:1;
    overflow:auto;
    padding:34px 22px 20px;
    scroll-behavior:smooth;
}

.inner{
    max-width:1000px;
    margin:auto;
}

/* WELCOME */

.welcome{
    text-align:center;
    padding:7vh 0;
}

.welcome-icon{
    font-size:52px;
    margin-bottom:12px;
}

.welcome h1{
    font-size:40px;
    margin-bottom:10px;
}

.welcome p{
    color:var(--muted);
    margin-bottom:30px;
}

/* FOUR CHOICES */

.examples{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
    text-align:left;
}

.example{
    padding:16px;
    border-radius:13px;
    background:rgba(23,16,31,.92);
    border:1px solid #352542;
    cursor:pointer;
    transition:.2s;
}

.example:hover{
    transform:translateY(-2px);
    border-color:#9b5cff;
    background:#241531;
}

.example strong{
    display:block;
    margin-bottom:6px;
}

.example span{
    color:#a89daf;
    font-size:13px;
    line-height:1.45;
}

/* MESSAGES */

.message{
    margin:0 auto 24px;
    max-width:1000px;
}

.label{
    font-size:10px;
    color:#82768d;
    font-weight:800;
    letter-spacing:1px;
    margin-bottom:7px;
}

.user{
    max-width:78%;
    margin-left:auto;
    padding:14px 17px;
    border-radius:15px;
    background:
        linear-gradient(
            135deg,
            rgba(71,38,101,.88),
            rgba(38,25,51,.96)
        );
    border:1px solid rgba(168,85,247,.3);
    white-space:pre-wrap;
    line-height:1.55;
}

.ai{
    padding:3px 0;
    line-height:1.6;
}

.loading{
    color:#bcaacb;
    font-style:italic;
    padding:16px 0;
}

.error{
    padding:16px;
    border:1px solid #6d3040;
    background:rgba(75,20,35,.28);
    border-radius:12px;
    color:#ffd6df;
    white-space:pre-wrap;
}

/* CAMPAIGN */

.result{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.hero{
    padding:25px;
    border-radius:17px;
    background:
        linear-gradient(
            135deg,
            rgba(42,24,62,.96),
            rgba(27,18,36,.98)
        );
    border:1px solid rgba(168,85,247,.32);
}

.hero h1{
    font-size:31px;
    margin-bottom:9px;
}

.hero p{
    color:#d0c8d5;
    line-height:1.7;
}

.pills{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:14px;
}

.pill{
    padding:6px 10px;
    border-radius:999px;
    background:#291a38;
    border:1px solid #4b3160;
    color:#cdb7df;
    font-size:12px;
}

.section{
    border:1px solid #352343;
    border-radius:15px;
    background:rgba(20,14,27,.94);
    overflow:hidden;
}

.section h2{
    font-size:18px;
    padding:15px 18px;
    border-bottom:1px solid #352343;
}

.body{
    padding:18px;
}

.body>p{
    color:#cec5d4;
    line-height:1.7;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:12px;
}

.card{
    background:rgba(25,17,33,.96);
    border:1px solid #3a2948;
    border-radius:12px;
    padding:15px;
}

.card h3{
    font-size:16px;
    margin-bottom:7px;
}

.card h4{
    font-size:12px;
    color:#b5a7bd;
    margin:11px 0 5px;
    text-transform:uppercase;
    letter-spacing:.4px;
}

.card p,
.card li{
    font-size:13px;
    color:#c9c0ce;
    line-height:1.55;
}

.card ul{
    padding-left:18px;
}

.stats{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:7px;
    margin-top:10px;
}

.stat{
    background:#241a2b;
    border-radius:8px;
    padding:8px;
    text-align:center;
}

.stat b{
    display:block;
    font-size:16px;
}

.stat small{
    color:#81758c;
    font-size:9px;
    text-transform:uppercase;
}

.boss{
    border-color:#74364e;
    background:
        linear-gradient(
            135deg,
            #29151f,
            #171018
        );
}

/* PLAYER CHOICES */

.choices{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:11px;
}

.choice{
    display:flex;
    gap:11px;
    width:100%;
    padding:14px;
    border-radius:12px;
    border:1px solid rgba(167,112,255,.3);
    background:
        linear-gradient(
            135deg,
            rgba(44,25,68,.9),
            rgba(24,18,34,.96)
        );
    color:#fff;
    text-align:left;
    cursor:pointer;
}

.choice:hover{
    border-color:#a76cff;
    transform:translateY(-2px);
}

.num{
    width:29px;
    height:29px;
    min-width:29px;
    display:grid;
    place-items:center;
    border-radius:8px;
    background:#7c3aed;
    font-weight:900;
}

.choice strong{
    display:block;
    margin-bottom:4px;
}

.choice small{
    color:#b8aec4;
    line-height:1.4;
}

/* INPUT */

.input{
    padding:16px 20px 20px;
    background:
        linear-gradient(
            transparent,
            var(--bg) 25%
        );
    flex:none;
}

.box{
    max-width:900px;
    margin:auto;
    background:rgba(21,14,28,.97);
    border:1px solid rgba(168,85,247,.38);
    border-radius:16px;
    padding:11px;
    box-shadow:
        0 12px 45px rgba(0,0,0,.25);
}

textarea{
    width:100%;
    min-height:68px;
    max-height:180px;
    resize:none;
    background:transparent;
    border:0;
    outline:0;
    color:white;
    padding:6px;
    font-size:15px;
    line-height:1.5;
}

textarea::placeholder{
    color:#756a7c;
}

.bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.hint{
    font-size:11px;
    color:#665b6d;
}

.send{
    border:0;
    border-radius:10px;
    padding:10px 16px;
    background:
        linear-gradient(
            135deg,
            var(--purple),
            var(--purple2)
        );
    color:white;
    font-weight:800;
    cursor:pointer;
}

.send:disabled{
    opacity:.55;
    cursor:not-allowed;
}

/* MOBILE */

@media(max-width:700px){

    .sidebar{
        position:fixed;
        inset:0 auto 0 0;
        z-index:10;
        transform:translateX(-100%);
        transition:.25s;
    }

    .sidebar.open{
        transform:translateX(0);
    }

    .mobile{
        display:block;
    }

    .examples,
    .grid,
    .choices{
        grid-template-columns:1fr;
    }

    .stats{
        grid-template-columns:repeat(2,1fr);
    }

    .welcome h1{
        font-size:31px;
    }

    .user{
        max-width:90%;
    }

    .hint{
        display:none;
    }
}
</style>
</head>

<body>

<div class="bg">
    <span class="b1">⚔️</span>
    <span class="b2">🛡️</span>
    <span class="b3">🧙</span>
    <span class="b4">🏰</span>
    <span class="b5">🗡️</span>
    <span class="b6">🐉</span>
    <span class="b7">⚔️</span>
    <span class="b8">🛡️</span>
</div>

<div class="app">

<aside class="sidebar" id="sidebar">

    <div class="sidebar-head">

        <div class="logo">
            ⚔️ DM-AI <small>◈</small>
        </div>

        <button class="new" onclick="newCampaign()">
            + New Campaign
        </button>

    </div>

    <div class="history">
        Campaigns
    </div>

    <div class="list" id="list"></div>

</aside>

<main class="main">

    <div class="top">

        <button
            class="mobile"
            onclick="toggleSidebar()">
            ☰
        </button>

        <div
            class="title"
            id="title">
            New Campaign
        </div>

    </div>

    <div
        class="chat"
        id="chat">

        <div
            class="inner"
            id="inner">
        </div>

    </div>

    <div class="input">

        <div class="box">

            <textarea
                id="prompt"
                placeholder="Describe your adventure, character, NPC, monster, quest, or campaign..."
                onkeydown="key(event)">
            </textarea>

            <div class="bottom">

                <div class="hint">
                    Enter to generate • Shift + Enter for a new line
                </div>

                <button
                    class="send"
                    id="send"
                    onclick="generate()">

                    ⚔️ Generate

                </button>

            </div>

        </div>

    </div>

</main>

</div>

<script>

const KEY = "dm_ai_campaigns_v5";

let campaigns = [];
let current = null;
let busy = false;


/* STORAGE */

function load(){

    try{

        campaigns =
            JSON.parse(
                localStorage.getItem(KEY) || "[]"
            );

    }catch{

        campaigns = [];

    }

    if(!campaigns.length){

        create(false);

    }else{

        current = campaigns[0];

        renderList();
        render();

    }
}


function save(){

    localStorage.setItem(
        KEY,
        JSON.stringify(campaigns)
    );

}


/* CAMPAIGNS */

function create(saveIt=true){

    current = {

        id:
            Date.now() +
            Math.random(),

        name:
            "New Campaign",

        messages:
            []

    };

    campaigns.unshift(current);

    if(saveIt){
        save();
    }

    renderList();
    render();

    setTimeout(
        () =>
            document
                .getElementById("prompt")
                .focus(),
        50
    );

}


function newCampaign(){

    create(true);

    closeMobile();

}


/* SIDEBAR */

function renderList(){

    const el =
        document.getElementById("list");

    el.innerHTML = "";

    campaigns.forEach(c => {

        const row =
            document.createElement("div");

        row.className =
            "item " +
            (
                current &&
                c.id === current.id
                    ? "active"
                    : ""
            );


        const name =
            document.createElement("div");

        name.className =
            "name";

        name.textContent =
            "⚔️ " + c.name;

        name.onclick =
            () =>
                select(c.id);


        const x =
            document.createElement("button");

        x.className =
            "del";

        x.textContent =
            "✕";

        x.title =
            "Delete campaign";

        x.onclick =
            e => {

                e.stopPropagation();

                del(c.id);

            };


        row.append(
            name,
            x
        );

        el.appendChild(row);

    });

}


function select(id){

    current =
        campaigns.find(
            c => c.id === id
        ) || current;

    renderList();
    render();
    closeMobile();

}


function del(id){

    if(
        !confirm(
            "Delete this campaign?"
        )
    ){

        return;

    }


    campaigns =
        campaigns.filter(
            c => c.id !== id
        );


    if(!campaigns.length){

        create(false);

    }else{

        current =
            campaigns[0];

        save();
        renderList();
        render();

    }

}


/* MOBILE */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


function closeMobile(){

    document
        .getElementById("sidebar")
        .classList.remove("open");

}


/* KEYBOARD */

function key(e){

    if(
        e.key === "Enter" &&
        !e.shiftKey
    ){

        e.preventDefault();

        generate();

    }

}


/* SAFE HTML */

function escape(s){

    return String(
        s ?? ""
    ).replace(
        /[&<>"']/g,
        m =>
            ({
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#39;"
            })[m]
    );

}


function arr(v){

    if(Array.isArray(v)){
        return v;
    }

    if(v == null){
        return [];
    }

    return [v];

}


function text(v){

    if(v == null){
        return "";
    }

    if(typeof v === "object"){
        return JSON.stringify(v);
    }

    return String(v);

}


function bullets(v){

    return arr(v)
        .map(
            x =>
                `<li>${escape(text(x))}</li>`
        )
        .join("");

}


function field(label,v){

    if(!v){
        return "";
    }

    return `
        <h4>${escape(label)}</h4>
        <p>${escape(text(v))}</p>
    `;

}


function card(title,body,cls=""){

    return `
        <div class="card ${cls}">
            <h3>${escape(title)}</h3>
            ${body}
        </div>
    `;

}


/* RENDER */

function render(){

    if(!current){
        return;
    }

    document
        .getElementById("title")
        .textContent =
            current.name;


    const inner =
        document.getElementById("inner");


    if(
        !current.messages.length
    ){

        inner.innerHTML = `

            <div class="welcome">

                <div class="welcome-icon">
                    🧙‍♂️
                </div>

                <h1>
                    What do you want to create?
                </h1>

                <p>
                    Tell DM-AI what you want and it will build the adventure.
                </p>

                <div class="examples">

                    <div
                        class="example"
                        onclick="example(this)">

                        <strong>
                            🐉 Epic Fantasy
                        </strong>

                        <span>
                            Create an epic fantasy campaign involving an ancient dragon returning after 1,000 years.
                        </span>

                    </div>


                    <div
                        class="example"
                        onclick="example(this)">

                        <strong>
                            🩸 Dark Horror
                        </strong>

                        <span>
                            Create a dark horror campaign where an entire village mysteriously disappears.
                        </span>

                    </div>


                    <div
                        class="example"
                        onclick="example(this)">

                        <strong>
                            🏰 Dungeon Crawl
                        </strong>

                        <span>
                            Create a dangerous dungeon filled with traps, monsters, treasure and a powerful boss.
                        </span>

                    </div>


                    <div
                        class="example"
                        onclick="example(this)">

                        <strong>
                            🧙 Character Party
                        </strong>

                        <span>
                            Create four detailed player characters and the NPCs that connect them to a campaign.
                        </span>

                    </div>

                </div>

            </div>

        `;

        return;

    }


    inner.innerHTML =
        current.messages
            .map(
                m =>

                    m.role === "user"

                        ? `

                            <div class="message">

                                <div class="label">
                                    YOU
                                </div>

                                <div class="user">
                                    ${escape(m.content)}
                                </div>

                            </div>

                        `

                        :

                        `

                            <div class="message">

                                <div class="label">
                                    DM-AI
                                </div>

                                <div class="ai">

                                    ${
                                        m.loading

                                            ?

                                            `
                                            <div class="loading">
                                                🧙 DM-AI is building your campaign...
                                            </div>
                                            `

                                            :

                                        m.error

                                            ?

                                            `
                                            <div class="error">
                                                ${escape(m.error)}
                                            </div>
                                            `

                                            :

                                            renderResult(
                                                m.data
                                            )
                                    }

                                </div>

                            </div>

                        `
            )
            .join("");


    requestAnimationFrame(
        () => {

            const chat =
                document.getElementById(
                    "chat"
                );

            chat.scrollTop =
                chat.scrollHeight;

        }
    );

}


/* RESULT RENDERER */

function renderResult(d){

    if(
        !d ||
        typeof d !== "object"
    ){

        return `
            <div class="error">
                Gemini returned no structured campaign data.
            </div>
        `;

    }


    const meta =
        [
            d.setting,
            d.tone,
            d.recommendedLevel
        ]
        .filter(Boolean)
        .map(
            x =>
                `
                <span class="pill">
                    ${escape(text(x))}
                </span>
                `
        )
        .join("");


    let h = `

        <div class="result">

            <div class="hero">

                <h1>
                    ${escape(
                        d.title ||
                        "Untitled Campaign"
                    )}
                </h1>

                <p>
                    ${escape(
                        d.overview || ""
                    )}
                </p>

                <div class="pills">
                    ${meta}
                </div>

            </div>

    `;


    if(
        d.openingHook ||
        d.mainStory
    ){

        h += `

            <section class="section">

                <h2>
                    📜 Story
                </h2>

                <div class="body">

                    ${
                        d.openingHook
                            ?

                            `
                            <p>
                                <b>Opening Hook:</b>
                                ${escape(
                                    d.openingHook
                                )}
                            </p>
                            `

                            :

                            ""
                    }


                    ${
                        d.mainStory
                            ?

                            `
                            <p
                                style="margin-top:12px"
                            >
                                <b>Main Story:</b>
                                ${escape(
                                    d.mainStory
                                )}
                            </p>
                            `

                            :

                            ""
                    }

                </div>

            </section>

        `;

    }


    /* CHAPTERS */

    if(
        arr(d.chapters).length
    ){

        h += `

            <section class="section">

                <h2>
                    📚 Chapters
                </h2>

                <div class="body grid">

                    ${
                        arr(d.chapters)
                            .map(
                                c =>

                                    card(

                                        `Chapter ${
                                            c.number ?? ""
                                        }: ${
                                            c.title || ""
                                        }`,

                                        `
                                        ${field(
                                            "Summary",
                                            c.summary
                                        )}

                                        ${field(
                                            "Objectives",
                                            arr(
                                                c.objectives

/* EXAMPLES */

function example(el){

    const input =
        document.getElementById(
            "prompt"
        );

    input.value =
        el.querySelector(
            "span"
        ).textContent;

    input.focus();

}


/* CHOICES */

function choose(t){

    document
        .getElementById("prompt")
        .value = t;

    generate();

}


/* GENERATE */

async function generate(){

    if(
        busy ||
        !current
    ){

        return;

    }


    const input =
        document.getElementById(
            "prompt"
        );

    const p =
        input.value.trim();


    if(!p){
        return;
    }


    busy = true;


    const btn =
        document.getElementById(
            "send"
        );

    btn.disabled = true;

    btn.textContent =
        "⚔️ Building...";


    current.messages.push(

        {
            role:"user",
            content:p
        },

        {
            role:"ai",
            loading:true
        }

    );


    if(
        current.name ===
        "New Campaign"
    ){

        current.name =
            p.length > 34
                ? p.slice(0,34) + "…"
                : p;

    }


    save();

    renderList();
    render();

    input.value = "";


    try{

        const controller =
            new AbortController();

        const timer =
            setTimeout(
                () =>
                    controller.abort(),
                120000
            );


        const response =
            await fetch(
                "/api/generate",
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            prompt:p
                        }),

                    signal:
                        controller.signal
                }
            );


        clearTimeout(timer);


        const raw =
            await response.text();


        let data;


        try{

            data =
                JSON.parse(raw);

        }catch{

            throw new Error(
                "Server returned invalid JSON: " +
                raw.slice(0,500)
            );

        }


        current.messages =
            current.messages.filter(
                m => !m.loading
            );


        if(
            !response.ok
        ){

            throw new Error(
                data.message ||
                data.error ||
                data.details ||
                "Gemini request failed."
            );

        }


        let result =
            data.result ??
            data.campaign;


        if(
            typeof result ===
            "string"
        ){

            try{

                result =
                    JSON.parse(result);

            }catch{

                throw new Error(
                    "Gemini returned text instead of campaign JSON."
                );

            }

        }


        if(
            !result ||
            typeof result !==
            "object"
        ){

            throw new Error(
                "Gemini returned no campaign data."
            );

        }


        current.messages.push(
            {
                role:"ai",
                data:result
            }
        );


        save();

        renderList();
        render();


    }catch(e){

        current.messages =
            current.messages.filter(
                m => !m.loading
            );


        current.messages.push(
            {
                role:"ai",

                error:
                    e.name ===
                    "AbortError"

                        ?

                        "Gemini took too long to respond. Try again."

                        :

                        (
                            e.message ||
                            "Unable to generate."
                        )
            }
        );


        save();
        render();

    }finally{

        busy = false;

        btn.disabled = false;

        btn.textContent =
            "⚔️ Generate";

    }

}


load();
