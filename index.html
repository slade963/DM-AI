<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DM-AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #0d0d0f;
    color: white;
    height: 100vh;
    overflow: hidden;
}

/* =========================
   FANTASY BACKGROUND
========================= */

.fantasy-background {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
    z-index: 0;
}

.fantasy-emoji {
    position: absolute;
    font-size: 52px;
    opacity: 0.065;
    animation: float 12s infinite ease-in-out;
}

.emoji1 { top: 10%; left: 25%; }
.emoji2 { top: 25%; right: 8%; animation-delay: 2s; }
.emoji3 { bottom: 15%; left: 20%; animation-delay: 4s; }
.emoji4 { bottom: 25%; right: 20%; animation-delay: 1s; }
.emoji5 { top: 55%; left: 5%; animation-delay: 3s; }
.emoji6 { top: 8%; right: 30%; animation-delay: 5s; }
.emoji7 { bottom: 5%; right: 5%; animation-delay: 6s; }
.emoji8 { top: 40%; right: 40%; animation-delay: 2s; }
.emoji9 { top: 75%; left: 45%; animation-delay: 7s; }
.emoji10 { top: 15%; left: 5%; animation-delay: 4s; }

@keyframes float {
    0%, 100% {
        transform: translateY(0) rotate(0deg);
    }

    50% {
        transform: translateY(-20px) rotate(5deg);
    }
}

/* =========================
   APP
========================= */

.app {
    position: relative;
    z-index: 1;
    display: flex;
    height: 100vh;
}

/* =========================
   SIDEBAR
========================= */

.sidebar {
    width: 270px;
    background: rgba(20,20,22,.97);
    border-right: 1px solid #29292d;
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
}

.sidebar-header {
    padding: 22px;
    border-bottom: 1px solid #29292d;
}

.logo {
    font-size: 24px;
    font-weight: bold;
    margin-bottom: 18px;
}

.new-campaign {
    width: 100%;
    background: white;
    color: #111;
    border: none;
    border-radius: 10px;
    padding: 12px;
    font-weight: bold;
    cursor: pointer;
}

.new-campaign:hover {
    background: #ddd;
}

.history-title {
    padding: 18px 20px 10px;
    font-size: 12px;
    color: #777;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 5px 10px;
}

.chat-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px;
    border-radius: 9px;
    cursor: pointer;
    margin-bottom: 4px;
}

.chat-item:hover {
    background: #222226;
}

.chat-item.active {
    background: #29292e;
}

.chat-name {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    font-size: 14px;
    flex: 1;
}

.delete-chat {
    background: none;
    border: none;
    color: #777;
    cursor: pointer;
    opacity: 0;
}

.chat-item:hover .delete-chat {
    opacity: 1;
}

.delete-chat:hover {
    color: #ff5c5c;
}

/* =========================
   MAIN
========================= */

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.topbar {
    height: 65px;
    border-bottom: 1px solid #29292d;
    display: flex;
    align-items: center;
    padding: 0 25px;
    background: rgba(13,13,15,.9);
    flex-shrink: 0;
}

.mobile-menu {
    display: none;
    background: none;
    border: none;
    color: white;
    font-size: 24px;
    cursor: pointer;
    margin-right: 15px;
}

.campaign-title {
    font-size: 16px;
    color: #ddd;
    font-weight: 600;
}

/* =========================
   CHAT
========================= */

.chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 40px 20px;
    scroll-behavior: smooth;
}

/* =========================
   WELCOME
========================= */

.welcome {
    max-width: 850px;
    margin: auto;
    text-align: center;
    padding-top: 7vh;
}

.welcome-icon {
    font-size: 50px;
    margin-bottom: 15px;
}

.welcome h1 {
    font-size: 42px;
    margin-bottom: 12px;
}

.welcome p {
    color: #8c8c91;
    font-size: 17px;
    margin-bottom: 35px;
}

/* =========================
   EXAMPLES
========================= */

.examples {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 12px;
    margin-bottom: 30px;
}

.example {
    background: rgba(23,23,25,.9);
    border: 1px solid #29292d;
    border-radius: 12px;
    padding: 16px;
    text-align: left;
    cursor: pointer;
    transition: .2s;
}

.example:hover {
    background: #202024;
    transform: translateY(-2px);
}

.example-title {
    font-weight: bold;
    margin-bottom: 6px;
}

.example-text {
    color: #85858a;
    font-size: 13px;
    line-height: 1.45;
}

/* =========================
   MESSAGES
========================= */

.message {
    max-width: 1000px;
    margin: 0 auto 28px;
}

.message-label {
    font-size: 11px;
    color: #777;
    margin-bottom: 7px;
    font-weight: bold;
    letter-spacing: .5px;
}

.message-user {
    background: #222226;
    border-radius: 14px;
    padding: 15px 18px;
    margin-left: auto;
    max-width: 75%;
    line-height: 1.55;
    white-space: pre-wrap;
}

.message-ai {
    padding: 10px 5px;
    line-height: 1.7;
}

/* =========================
   CAMPAIGN DISPLAY
========================= */

.campaign-result {
    width: 100%;
}

.campaign-header {
    background: linear-gradient(135deg,#19191d,#242429);
    border: 1px solid #343438;
    border-radius: 16px;
    padding: 28px;
    margin-bottom: 20px;
}

.campaign-header h1 {
    font-size: 32px;
    margin-bottom: 12px;
}

.campaign-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.meta-pill {
    background: #2a2a30;
    border: 1px solid #3a3a42;
    border-radius: 20px;
    padding: 7px 12px;
    font-size: 12px;
    color: #ccc;
}

.section {
    background: rgba(20,20,23,.94);
    border: 1px solid #29292e;
    border-radius: 15px;
    margin-bottom: 18px;
    overflow: hidden;
}

.section-title {
    padding: 17px 20px;
    border-bottom: 1px solid #29292e;
    font-size: 19px;
    font-weight: bold;
}

.section-body {
    padding: 20px;
}

.card-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 14px;
}

.content-card {
    background: #18181b;
    border: 1px solid #2d2d32;
    border-radius: 12px;
    padding: 16px;
}

.content-card h3 {
    margin-bottom: 8px;
    font-size: 16px;
}

.content-card h4 {
    margin-top: 12px;
    margin-bottom: 5px;
    color: #bbb;
    font-size: 13px;
}

.content-card p {
    color: #ccc;
    line-height: 1.55;
    font-size: 14px;
}

.content-card ul {
    padding-left: 20px;
    color: #ccc;
}

.content-card li {
    margin: 5px 0;
}

.stat-grid {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 10px;
    margin-top: 12px;
}

.stat {
    background: #222226;
    border-radius: 9px;
    padding: 10px;
    text-align: center;
}

.stat-label {
    display: block;
    color: #777;
    font-size: 10px;
    text-transform: uppercase;
}

.stat-value {
    display: block;
    margin-top: 3px;
    font-size: 17px;
    font-weight: bold;
}

.chapter {
    border-left: 3px solid #777;
}

.chapter-number {
    color: #888;
    font-size: 12px;
    text-transform: uppercase;
    margin-bottom: 5px;
}

.boss {
    border: 1px solid #633;
    background: linear-gradient(135deg,#211416,#18181b);
}

.loading {
    color: #999;
    font-style: italic;
}

/* =========================
   INPUT
========================= */

.input-section {
    padding: 20px;
    background: linear-gradient(transparent,#0d0d0f 25%);
    flex-shrink: 0;
}

.input-container {
    max-width: 850px;
    margin: auto;
    background: #1a1a1d;
    border: 1px solid #343438;
    border-radius: 16px;
    padding: 12px;
}

textarea {
    width: 100%;
    min-height: 70px;
    max-height: 180px;
    resize: none;
    background: transparent;
    border: none;
    outline: none;
    color: white;
    font-size: 15px;
    padding: 5px;
    font-family: inherit;
}

textarea::placeholder {
    color: #6f6f74;
}

.input-bottom {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 8px;
}

.hint {
    color: #666;
    font-size: 12px;
}

.generate {
    border: none;
    background: white;
    color: #111;
    border-radius: 10px;
    padding: 10px 17px;
    font-weight: bold;
    cursor: pointer;
}

.generate:hover {
    background: #ddd;
}

.generate:disabled {
    opacity: .5;
    cursor: not-allowed;
}

/* =========================
   MOBILE
========================= */

@media(max-width:700px) {

    .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 10;
        transform: translateX(-100%);
        transition: .3s;
    }

    .sidebar.open {
        transform: translateX(0);
    }

    .mobile-menu {
        display: block;
    }

    .welcome h1 {
        font-size: 32px;
    }

    .examples {
        grid-template-columns: 1fr;
    }

    .card-grid {
        grid-template-columns: 1fr;
    }

    .stat-grid {
        grid-template-columns: repeat(2,1fr);
    }

    .message-user {
        max-width: 90%;
    }

    .hint {
        display: none;
    }
}
</style>
</head>

<body>

<!-- BACKGROUND -->

<div class="fantasy-background">
    <div class="fantasy-emoji emoji1">⚔️</div>
    <div class="fantasy-emoji emoji2">🛡️</div>
    <div class="fantasy-emoji emoji3">🧙</div>
    <div class="fantasy-emoji emoji4">🏰</div>
    <div class="fantasy-emoji emoji5">🗡️</div>
    <div class="fantasy-emoji emoji6">🐉</div>
    <div class="fantasy-emoji emoji7">⚔️</div>
    <div class="fantasy-emoji emoji8">🛡️</div>
    <div class="fantasy-emoji emoji9">🐲</div>
    <div class="fantasy-emoji emoji10">🧝</div>
</div>

<div class="app">

<!-- SIDEBAR -->

<aside class="sidebar" id="sidebar">

    <div class="sidebar-header">

        <div class="logo">
            ⚔️ DM-AI
        </div>

        <button class="new-campaign" onclick="newCampaign()">
            + New Campaign
        </button>

    </div>

    <div class="history-title">
        Campaigns
    </div>

    <div class="chat-list" id="chatList"></div>

</aside>

<!-- MAIN -->

<main class="main">

    <div class="topbar">

        <button class="mobile-menu" onclick="toggleSidebar()">
            ☰
        </button>

        <div class="campaign-title" id="campaignTitle">
            New Campaign
        </div>

    </div>

    <div class="chat-area" id="chatArea"></div>

    <div class="input-section">

        <div class="input-container">

            <textarea
                id="prompt"
                placeholder="Describe the campaign you want..."
                onkeydown="handleKey(event)">
            </textarea>

            <div class="input-bottom">

                <div class="hint">
                    Press Enter to generate
                </div>

                <button
                    class="generate"
                    id="generateButton"
                    onclick="generateCampaign()">

                    Generate ⚔️

                </button>

            </div>

        </div>

    </div>

</main>

</div>

<script>

/* =========================================================
   DATA
========================================================= */

let campaigns = [];
let currentCampaign = null;
let isGenerating = false;


/* =========================================================
   STORAGE
========================================================= */

function loadCampaigns() {

    try {

        const saved =
            localStorage.getItem("dm_ai_campaigns");

        if (saved) {
            campaigns = JSON.parse(saved);
        }

    } catch (error) {

        console.error(error);
        campaigns = [];

    }
}


function saveCampaigns() {

    localStorage.setItem(
        "dm_ai_campaigns",
        JSON.stringify(campaigns)
    );

}


/* =========================================================
   NEW CAMPAIGN
========================================================= */

function newCampaign() {

    const campaign = {

        id: Date.now(),

        name: "New Campaign",

        messages: []

    };

    campaigns.unshift(campaign);

    currentCampaign = campaign;

    saveCampaigns();

    updateSidebar();

    renderCampaign();

    document.getElementById("prompt").focus();

    closeMobileSidebar();

}


/* =========================================================
   SIDEBAR
========================================================= */

function updateSidebar() {

    const list =
        document.getElementById("chatList");

    list.innerHTML = "";

    campaigns.forEach(campaign => {

        const item =
            document.createElement("div");

        item.className =
            "chat-item " +
            (
                currentCampaign &&
                currentCampaign.id === campaign.id
                    ? "active"
                    : ""
            );

        const name =
            document.createElement("div");

        name.className = "chat-name";

        name.textContent =
            "⚔️ " + campaign.name;

        name.onclick = () => {
            selectCampaign(campaign.id);
        };

        const deleteButton =
            document.createElement("button");

        deleteButton.className =
            "delete-chat";

        deleteButton.textContent = "✕";

        deleteButton.onclick = event => {

            event.stopPropagation();

            deleteCampaign(
                campaign.id
            );

        };

        item.appendChild(name);

        item.appendChild(deleteButton);

        list.appendChild(item);

    });

}


function selectCampaign(id) {

    currentCampaign =
        campaigns.find(
            campaign =>
                campaign.id === id
        );

    if (!currentCampaign) {
        return;
    }

    renderCampaign();

    updateSidebar();

    closeMobileSidebar();

}


function deleteCampaign(id) {

    if (!confirm("Delete this campaign?")) {
        return;
    }

    campaigns =
        campaigns.filter(
            campaign =>
                campaign.id !== id
        );

    if (
        currentCampaign &&
        currentCampaign.id === id
    ) {

        currentCampaign =
            campaigns.length
                ? campaigns[0]
                : null;

    }

    saveCampaigns();

    if (!currentCampaign) {
        newCampaign();
    } else {
        updateSidebar();
        renderCampaign();
    }

}


/* =========================================================
   RENDER CAMPAIGN
========================================================= */

function renderCampaign() {

    const area =
        document.getElementById("chatArea");

    const title =
        document.getElementById("campaignTitle");

    if (!currentCampaign) {

        area.innerHTML = "";

        title.textContent =
            "New Campaign";

        return;

    }

    title.textContent =
        currentCampaign.name;

    if (
        currentCampaign.messages.length === 0
    ) {

        area.innerHTML = `

            <div class="welcome">

                <div class="welcome-icon">
                    🧙‍♂️
                </div>

                <h1>
                    What do you want to create?
                </h1>

                <p>
                    Tell DM-AI what you want and we'll build the campaign for you.
                </p>

                <div class="examples">

                    <div class="example"
                         onclick="useExample(this)">

                        <div class="example-title">
                            🐉 Epic Fantasy
                        </div>

                        <div class="example-text">
                            Create an epic fantasy campaign involving an ancient dragon returning after 1,000 years.
                        </div>

                    </div>

                    <div class="example"
                         onclick="useExample(this)">

                        <div class="example-title">
                            🩸 Dark Horror
                        </div>

                        <div class="example-text">
                            Create a dark horror campaign where an entire village mysteriously disappears.
                        </div>

                    </div>

                    <div class="example"
                         onclick="useExample(this)">

                        <div class="example-title">
                            🏰 Political Intrigue
                        </div>

                        <div class="example-text">
                            Create a campaign centered around rival kingdoms preparing for war.
                        </div>

                    </div>

                    <div class="example"
                         onclick="useExample(this)">

                        <div class="example-title">
                            🗡️ Dungeon Adventure
                        </div>

                        <div class="example-text">
                            Create a dangerous dungeon filled with traps, monsters, treasure and a powerful boss.
                        </div>

                    </div>

                </div>

            </div>

        `;

        return;

    }

    area.innerHTML = "";

    currentCampaign.messages.forEach(message => {

        const wrapper =
            document.createElement("div");

        wrapper.className =
            "message";

        if (message.role === "user") {

            wrapper.innerHTML = `

                <div class="message-label">
                    YOU
                </div>

                <div class="message-user"></div>

            `;

            wrapper
                .querySelector(".message-user")
                .textContent =
                    message.content;

        } else {

            wrapper.innerHTML = `

                <div class="message-label">
                    DM-AI
                </div>

                <div class="message-ai"></div>

            `;

            const aiBox =
                wrapper.querySelector(".message-ai");

            if (
                message.data &&
                typeof message.data === "object"
            ) {

                aiBox.appendChild(
                    renderCampaignData(
                        message.data
                    )
                );

            } else {

                aiBox.textContent =
                    message.content || "";

            }

        }

        area.appendChild(wrapper);

    });

    area.scrollTop =
        area.scrollHeight;

}


/* =========================================================
   CAMPAIGN JSON → UI
========================================================= */

function renderCampaignData(data) {

    const container =
        document.createElement("div");

    container.className =
        "campaign-result";


    /* CAMPAIGN */

    if (data.campaign) {

        const c = data.campaign;

        const header =
            document.createElement("div");

        header.className =
            "campaign-header";

        header.innerHTML = `

            <h1>
                🗺️ ${escapeHTML(c.title || "Untitled Campaign")}
            </h1>

            <p>
                ${escapeHTML(c.overview || "")}
            </p>

            <br>

            <div class="campaign-meta">

                ${pill("🎭 " + (c.tone || "Fantasy"))}

                ${pill("⚔️ Level " + (c.recommendedLevel || "1"))}

                ${pill("🌎 " + (c.setting || "Unknown Setting"))}

            </div>

        `;

        container.appendChild(header);


        /* OVERVIEW */

        addSection(
            container,
            "📖 Campaign Overview",
            `

                <p>
                    ${escapeHTML(c.overview || "")}
                </p>

                <br>

                <h4>Opening Hook</h4>

                <p>
                    ${escapeHTML(c.openingHook || "")}
                </p>

                <br>

                <h4>Main Story</h4>

                <p>
                    ${escapeHTML(c.mainStory || "")}
                </p>

            `
        );

    }


    /* CHAPTERS */

    if (Array.isArray(data.chapters)) {

        addSection(
            container,
            "📚 Chapters",
            cardGrid(
                data.chapters.map(chapter => `

                    <div class="content-card chapter">

                        <div class="chapter-number">
                            Chapter ${escapeHTML(chapter.number)}
                        </div>

                        <h3>
                            ${escapeHTML(chapter.title)}
                        </h3>

                        <p>
                            ${escapeHTML(chapter.summary)}
                        </p>

                        ${listHTML(
                            "Objectives",
                            chapter.objectives
                        )}

                        ${listHTML(
                            "Events",
                            chapter.events
                        )}

                    </div>

                `)
            )
        );

    }


    /* MAIN QUESTS */

    if (Array.isArray(data.mainQuests)) {

        addSection(
            container,
            "🎯 Main Quests",
            cardGrid(
                data.mainQuests.map(q => `

                    <div class="content-card">

                        <h3>
                            ${escapeHTML(q.name)}
                        </h3>

                        <p>
                            ${escapeHTML(q.description)}
                        </p>

                        ${listHTML(
                            "Objectives",
                            q.objectives
                        )}

                        ${listHTML(
                            "Rewards",
                            q.rewards
                        )}

                    </div>

                `)
            )
        );

    }


    /* SIDE QUESTS */

    if (Array.isArray(data.sideQuests)) {

        addSection(
            container,
            "🧭 Side Quests",
            cardGrid(
                data.sideQuests.map(q => `

                    <div class="content-card">

                        <h3>
                            ${escapeHTML(q.name)}
                        </h3>

                        <p>
                            ${escapeHTML(q.description)}
                        </p>

                        ${listHTML(
                            "Objectives",
                            q.objectives
                        )}

                        ${listHTML(
                            "Rewards",
                            q.rewards
                        )}

                    </div>

                `)
            )
        );

    }


    /* NPCS */

    if (Array.isArray(data.npcs)) {

        addSection(
            container,
            "👤 NPCs",
            cardGrid(
                data.npcs.map(npc => `

                    <div class="content-card">

                        <h3>
                            👤 ${escapeHTML(npc.name)}
                        </h3>

                        <p>
                            ${escapeHTML(npc.race)}
                            ${npc.role ? " • " + escapeHTML(npc.role) : ""}
                        </p>

                        <h4>Appearance</h4>
                        <p>${escapeHTML(npc.appearance)}</p>

                        <h4>Personality</h4>
                        <p>${escapeHTML(npc.personality)}</p>

                        <h4>Motivation</h4>
                        <p>${escapeHTML(npc.motivation)}</p>

                        <h4>Secret</h4>
                        <p>${escapeHTML(npc.secret)}</p>

                        <h4>Relationship to Players</h4>
                        <p>${escapeHTML(npc.relationshipToPlayers)}</p>

                        <h4>Dialogue</h4>
                        <p>
                            "${escapeHTML(npc.dialogue)}"
                        </p>

                    </div>

                `)
            )
        );

    }


    /* PLAYER CHARACTERS */

    if (
        Array.isArray(data.playerCharacters) &&
        data.playerCharacters.length
    ) {

        addSection(
            container,
            "🧙 Player Characters",
            cardGrid(
                data.playerCharacters.map(pc => `

                    <div class="content-card">

                        <h3>
                            🧙 ${escapeHTML(pc.name)}
                        </h3>

                        <p>
                            ${escapeHTML(pc.race)}
                            •
                            ${escapeHTML(pc.class)}
                            •
                            Level ${escapeHTML(pc.level)}
                        </p>

                        <div class="stat-grid">

                            ${stat("STR",pc.strength)}
                            ${stat("DEX",pc.dexterity)}
                            ${stat("CON",pc.constitution)}
                            ${stat("INT",pc.intelligence)}
                            ${stat("WIS",pc.wisdom)}
                            ${stat("CHA",pc.charisma)}

                        </div>

                        <h4>HP</h4>

/* =========================================================
   UI HELPERS
========================================================= */

function addSection(container,title,content) {

    const section =
        document.createElement("div");

    section.className = "section";

    section.innerHTML = `

        <div class="section-title">
            ${title}
        </div>

        <div class="section-body">
            ${content}
        </div>

    `;

    container.appendChild(section);

}


function cardGrid(cards) {

    return `
        <div class="card-grid">
            ${cards.join("")}
        </div>
    `;

}


function listHTML(title,items) {

    if (!Array.isArray(items) || !items.length) {
        return "";
    }

    return `

        <h4>${title}</h4>

        <ul>

            ${items.map(
                item =>
                    `<li>${escapeHTML(
                        typeof item === "object"
                            ? JSON.stringify(item)
                            : item
                    )}</li>`
            ).join("")}

        </ul>

    `;

}


function listOnly(items) {

    if (!Array.isArray(items)) {
        return "";
    }

    return `

        <ul>

            ${items.map(
                item =>
                    `<li>${escapeHTML(
                        typeof item === "object"
                            ? JSON.stringify(item)
                            : item
                    )}</li>`
            ).join("")}

        </ul>

    `;

}


function stat(label,value) {

    return `

        <div class="stat">

            <span class="stat-label">
                ${label}
            </span>

            <span class="stat-value">
                ${escapeHTML(value)}
            </span>

        </div>

    `;

}


function pill(text) {

    return `
        <span class="meta-pill">
            ${escapeHTML(text)}
        </span>
    `;

}


function escapeHTML(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* =========================================================
   GENERATE
========================================================= */

async function generateCampaign() {

    if (isGenerating) {
        return;
    }

    const input =
        document.getElementById("prompt");

    const button =
        document.getElementById("generateButton");

    const prompt =
        input.value.trim();

    if (!prompt) {
        input.focus();
        return;
    }

    if (!currentCampaign) {
        newCampaign();
    }

    currentCampaign.messages.push({

        role: "user",

        content: prompt

    });


    if (
        currentCampaign.name ===
        "New Campaign"
    ) {

        currentCampaign.name =
            createCampaignName(prompt);

    }

    input.value = "";

    saveCampaigns();

    updateSidebar();

    renderCampaign();

    isGenerating = true;

    button.disabled = true;

    button.textContent =
        "Creating... ⚔️";


    currentCampaign.messages.push({

        role: "ai",

        content:
            "🧙 DM-AI is building your campaign..."

    });

    renderCampaign();


    try {

        const response =
            await fetch(
                "/api/generate",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            prompt: prompt
                        })
                }
            );


        const data =
            await response.json();


        /* Remove loading */

        currentCampaign.messages.pop();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "The AI request failed."
            );

        }


        /*
           IMPORTANT:

           data.result is now an OBJECT,
           not a string.

           We store the object separately.
        */

        if (
            data.result &&
            typeof data.result === "object"
        ) {

            currentCampaign.messages.push({

                role: "ai",

                content: "",

                data: data.result

            });

        } else {

            currentCampaign.messages.push({

                role: "ai",

                content:
                    String(
                        data.result ||
                        "I wasn't able to generate a response."
                    )

            });

        }


        saveCampaigns();

        renderCampaign();

        updateSidebar();


    } catch (error) {

        console.error(
            "DM-AI error:",
            error
        );


        currentCampaign.messages.pop();


        currentCampaign.messages.push({

            role: "ai",

            content:
                "⚠️ Something went wrong.\n\n" +
                error.message

        });


        saveCampaigns();

        renderCampaign();

    }


    isGenerating = false;

    button.disabled = false;

    button.textContent =
        "Generate ⚔️";

}


/* =========================================================
   NAME
========================================================= */

function createCampaignName(prompt) {

    let name =
        prompt
            .replace(/\s+/g," ")
            .trim();

    if (name.length > 30) {

        name =
            name.substring(0,30) +
            "...";

    }

    return name;

}

========================================================= */

function useExample(element) {

    const text =
        element
            .querySelector(".example-text")
            .textContent;

    const input =
        document.getElementById("prompt");

    input.focus();

}

========================================================= */

function handleKey(event) {

    if (
        event.key === "Enter" &&
        !event.shiftKey
    ) {

        event.preventDefault();

        generateCampaign();

    }

}
